<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1f">
<style>[hidden]{display:none!important}</style>
<title>Factor Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Fredoka:wght@500;700&display=swap">
<style>
  :root {
    /* Layout: one-screen canvas game. The HUD floats over the top, the ship sits low,
       and everything streams out of a vanishing point just under the HUD. */
    --space-0: #070a1f;
    --space-1: #111742;
    --ink: #eef1ff;
    --ink-dim: #8f99d4;
    --track: #232b63;
    --cell: #161c4d;
    --cell-alt: #1e2662;
    --gold: #ffc857;
    --gold-light: #ffe9a0;
    --on-gold: #201600;
    --ice: #7fe3ff;
    --coral: #ff6b8b;
    --mint: #46e0b4;
    --violet: #8b6cff;
    --orange: #ff9a5a;
    --pink: #ff7aa8;
    --red: #ff3b4f;
    --blue: #5aa8ff;
    --tier-common: #c3c9e6;
    --tier-rare: var(--blue);
    --tier-epic: var(--violet);
    --tier-legendary: var(--gold);
    --font-display: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
    --font-ui: 'Chakra Petch', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  html { box-sizing: border-box; height: 100%; background: var(--space-0); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%; margin: 0; background: var(--space-0); color: var(--ink);
    font-family: var(--font-ui); font-size: 16px; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #app { position: relative; height: 100%; overflow: hidden; background: var(--space-0); }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud {
    position: relative; z-index: 5; pointer-events: none; padding: 12px 16px 0;
    background: linear-gradient(to bottom, color-mix(in srgb, var(--space-0) 88%, transparent), color-mix(in srgb, var(--space-0) 0%, transparent));
  }
  .bar { display: flex; align-items: center; gap: 10px; }
  .shields { display: flex; gap: 6px; margin-right: auto; }
  .shield { width: 20px; height: 22px; fill: var(--ice); stroke: var(--ice); transition: fill .2s, stroke .2s, opacity .2s; }
  .shield.lost { fill: transparent; stroke: var(--ink-dim); opacity: .55; }
  .tally { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .tally .of { color: var(--ink-dim); font-weight: 500; }
  #mute {
    pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--track);
    background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer;
  }
  #mute:focus-visible, .btn:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
  #mute.off .waves { display: none; }
  #quit {
    pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; cursor: pointer; display: grid; place-items: center;
    border: 1.5px solid color-mix(in srgb, var(--coral) 60%, transparent); background: color-mix(in srgb, var(--coral) 16%, transparent); color: var(--coral);
  }
  #quit:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
  .confirm {
    position: absolute; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: color-mix(in srgb, var(--space-0) 72%, transparent);
  }
  .confirm-card { width: 100%; max-width: 22rem; padding: 22px 22px 20px; border-radius: 18px; text-align: center; background: var(--space-1); border: 1.5px solid var(--track); }
  .confirm-card h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 30px; color: var(--gold); }
  .powers { position: absolute; left: 16px; top: 76px; display: flex; flex-direction: column; gap: 10px; }
  .power {
    position: relative; pointer-events: auto; width: 46px; height: 46px; padding: 0; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; border: 2px solid currentColor; background: color-mix(in srgb, var(--space-1) 85%, transparent);
  }
  [data-power="boost"] { color: var(--gold); }
  [data-power="zap"] { color: var(--pink); }
  [data-power="freeze"] { color: var(--ice); }
  .power i { position: absolute; right: -5px; bottom: -5px; padding: 0 4px; border-radius: 6px; background: var(--space-0); color: var(--ink-dim); font-style: normal; font-size: 10px; font-weight: 700; }
  .power:disabled { opacity: .28; cursor: default; }
  .power.on { opacity: 1; box-shadow: 0 0 18px currentColor; }
  .power:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
  /* Hangar */
  .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; width: 100%; }
  .card {
    display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 12px; text-align: center;
    border-radius: 16px; background: var(--space-1); border: 1.5px solid var(--track);
  }
  .card.current { border-color: var(--gold); box-shadow: 0 0 18px color-mix(in srgb, var(--gold) 22%, transparent); }
  .card.later { opacity: .55; }
  .card img { width: 96px; height: 96px; }
  .card b { font-family: var(--font-display); font-size: 16px; }
  .card small { flex: 1; font-size: 12.5px; line-height: 1.35; color: var(--ink-dim); }
  .card .row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
  .card .art { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--cell); }
  .card .art:not([data-power]) { color: var(--violet); }
  .card .badge { margin: 0; background: var(--gold); color: var(--on-gold); }
  .tag { padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--track); font-size: 12px; font-weight: 600; color: var(--ink-dim); }
  .paints { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .swatch { width: 40px; height: 40px; padding: 0; border-radius: 50%; cursor: pointer; border: 3px solid var(--track); background: linear-gradient(135deg, var(--a), var(--b)); }
  .swatch[aria-pressed="true"] { border-color: var(--ice); box-shadow: 0 0 12px color-mix(in srgb, var(--ice) 60%, transparent); }
  .swatch:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
  .btn.danger { background: var(--coral); color: var(--space-0); }
  #mute:not(.off) .slash { display: none; }
  .meter { display: flex; gap: 4px; margin-top: 8px; }
  .meter i { flex: 1; height: 6px; border-radius: 3px; background: var(--track); transition: background .25s; }
  .meter i.on { background: var(--gold); }

  .target { display: flex; flex-direction: column; align-items: center; margin-top: 12px; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); text-align: center; }
  .num {
    font-family: var(--font-display); font-weight: 700; font-size: clamp(68px, 20vw, 104px); line-height: 1;
    margin-top: 2px; color: var(--gold); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 28px color-mix(in srgb, var(--gold) 45%, transparent);
    transition: text-shadow .3s;
  }
  #hud.done .num { text-shadow: 0 0 44px color-mix(in srgb, var(--gold) 90%, transparent); }
  .num { white-space: nowrap; }
  .num.term { font-size: clamp(56px, 17vw, 92px); }
  .num.term-long { font-size: clamp(40px, 12vw, 76px); }
  .eq { display: flex; align-items: center; gap: 12px; margin-top: 6px; padding-bottom: 12px; }
  .times { font-family: var(--font-display); font-size: 26px; color: var(--ink-dim); }
  .slot {
    width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 700; font-size: 30px;
    border: 2px dashed var(--ink-dim); color: var(--ink-dim);
  }
  .slot.filled { border-style: solid; border-color: var(--gold); background: var(--gold); color: var(--on-gold); }
  .slot.pop { animation: pop .3s ease-out; }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

  #controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; align-items: center; gap: 12px;
    padding: 18px 16px 16px; touch-action: none;
    background: linear-gradient(to top, color-mix(in srgb, var(--space-0) 96%, transparent) 72%, color-mix(in srgb, var(--space-0) 0%, transparent));
  }
  .arrow {
    flex: none; width: 60px; height: 60px; border-radius: 16px; border: 1.5px solid var(--track);
    background: color-mix(in srgb, var(--space-1) 85%, transparent); color: var(--ink);
    display: grid; place-items: center; cursor: pointer; touch-action: none;
  }
  .arrow:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
  .arrow.held { background: var(--track); }
  #track {
    position: relative; flex: 1; min-width: 0; height: 60px; border-radius: 30px; cursor: grab; touch-action: none;
    background: var(--space-1); border: 1.5px solid var(--track);
  }
  #track::before {
    content: ''; position: absolute; left: 28px; right: 28px; top: 50%; height: 4px; margin-top: -2px;
    border-radius: 2px; background: var(--track);
  }
  #thumb {
    position: absolute; left: 0; top: 4px; bottom: 4px; width: 72px; border-radius: 26px; background: var(--gold);
    box-shadow: 0 0 18px color-mix(in srgb, var(--gold) 40%, transparent);
    display: grid; place-items: center; will-change: transform;
  }
  #thumb::after {
    content: ''; width: 24px; height: 18px; border-radius: 2px; opacity: .5;
    background: repeating-linear-gradient(90deg, var(--on-gold) 0 3px, transparent 3px 9px);
  }

  #flash {
    position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 40%, color-mix(in srgb, var(--coral) 55%, transparent) 100%);
  }
  #flash.hit { animation: flash .45s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  #app.shake { animation: shake .35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(3px); }
  }

  /* Menus: one centred panel. margin:auto centres it both ways and still lets a tall panel scroll. */
  #overlay {
    position: absolute; inset: 0; z-index: 10; display: flex; overflow-x: hidden; overflow-y: auto; padding: 24px 16px 32px;
    background: color-mix(in srgb, var(--space-0) 86%, transparent);
  }
  #overlay.solid { background: color-mix(in srgb, var(--space-0) 95%, transparent); }
  #app.menu #hud, #app.menu #controls { visibility: hidden; }
  .panel { margin: auto; width: 100%; max-width: 30rem; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .panel.wide { max-width: 64rem; }
  .cols { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .col { width: 100%; max-width: 30rem; display: flex; flex-direction: column; align-items: center; }
  @media (min-width: 860px) {
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; justify-items: center; }
  }
  .kicker { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ice); }
  #overlay h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 14vw, 64px);
    line-height: 1; color: var(--gold); text-wrap: balance;
  }
  .lede { margin: 14px 0 0; font-size: 18px; line-height: 1.45; }
  .hint { margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-dim); }
  .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 28px; margin: 18px 0 0; }
  .stats div { display: flex; flex-direction: column; gap: 2px; }
  .stats dt { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .stats dd { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums; }
  .btn {
    min-height: 54px; padding: 12px 30px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--gold); color: var(--on-gold); font-family: var(--font-display); font-weight: 700; font-size: 22px;
  }
  .btn:active { transform: translateY(1px); }
  .btn.big { width: 100%; max-width: 22rem; min-height: 68px; font-size: 28px; margin-top: 20px; box-shadow: 0 0 28px color-mix(in srgb, var(--gold) 35%, transparent); }
  .btn.ghost {
    background: transparent; color: var(--ice); border: 1.5px solid var(--track);
    font-size: 18px; min-height: 48px; padding: 8px 22px;
  }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; margin-top: 22px; }
  .who { margin: 22px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; }
  .who + .actions { margin-top: 10px; }
  .pilot { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .coin {
    display: inline-block; flex: none; width: 1em; height: 1em; border-radius: 50%; vertical-align: -0.14em;
    background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 55%, #b9851a);
    box-shadow: inset 0 0 0 .09em color-mix(in srgb, var(--on-gold) 25%, transparent);
  }
  .purse { flex: none; display: flex; align-items: center; gap: 5px; font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--gold); font-variant-numeric: tabular-nums; }
  .purse.pop { animation: pop .3s ease-out; }
  .wallet {
    margin: 12px 0 0; display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 999px;
    background: var(--cell); font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--gold);
  }
  .walletrow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; margin-top: 12px; }
  .walletrow .wallet { margin: 0; }
  .info {
    flex: none; width: 26px; height: 26px; margin: 0 -6px 0 2px; padding: 0; border-radius: 50%; cursor: pointer;
    border: 1.5px solid var(--ice); background: transparent; color: var(--ice);
    font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 700; font-size: 16px; line-height: 1;
  }
  .info[aria-expanded="true"] { background: var(--ice); color: var(--space-0); }
  .info:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }
  .pace { display: flex; width: 100%; max-width: 22rem; margin-top: 12px; border: 1.5px solid var(--track); border-radius: 12px; overflow: hidden; }
  .pace button {
    flex: 1; min-height: 44px; padding: 6px 10px; border: 0; background: transparent; color: var(--ink-dim); cursor: pointer;
    font-family: var(--font-display); font-weight: 700; font-size: 16px;
  }
  .pace button + button { border-left: 1.5px solid var(--track); }
  .pace button[aria-pressed="true"] { background: var(--ice); color: var(--space-0); }
  .pace button:focus-visible { outline: 3px solid var(--ice); outline-offset: -3px; }
  /* Rewards page: slim daily bar, tabs, red dots, creature viewer */
  .dbar { width: 100%; max-width: 30rem; display: flex; align-items: center; gap: 8px; margin: 0 0 14px; }
  .dlabel { flex: none; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); white-space: nowrap; }
  .dsegs { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 0; padding: 0; list-style: none; }
  .dsegs li { height: 20px; border-radius: 5px; display: grid; place-items: center; background: var(--cell); color: var(--gold); font: 700 10px/1 var(--font-display); font-variant-numeric: tabular-nums; }
  .dsegs li.done { background: color-mix(in srgb, var(--mint) 28%, var(--space-1)); color: var(--mint); }
  .dsegs li.now { background: var(--gold); color: var(--on-gold); }
  .dcollect { flex: none; height: 20px; padding: 0 9px; border: 0; border-radius: 6px; cursor: pointer; background: var(--gold); color: var(--on-gold); font: 700 12px/1 var(--font-display); white-space: nowrap; }
  .dbar .dcollect { animation: collect 1.4s ease-in-out infinite; }
  @keyframes collect {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 color-mix(in srgb, var(--gold) 70%, transparent); }
    50% { transform: scale(1.08); box-shadow: 0 0 14px 4px color-mix(in srgb, var(--gold) 60%, transparent); }
  }
  .dcollect.ghost { background: transparent; color: var(--ice); border: 1.5px solid var(--track); }
  .dcollect:disabled { opacity: .45; cursor: default; }
  .titlerow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px 14px; }
  #overlay .titlerow h1 { font-size: clamp(38px, 11.5vw, 54px); }
  .titlerow .wallet { margin: 0; }
  .backbtn {
    position: fixed; top: 12px; left: 12px; z-index: 11; display: flex; align-items: center; gap: 4px;
    min-height: 44px; padding: 6px 14px 6px 8px; border-radius: 14px; cursor: pointer;
    border: 1.5px solid var(--track); background: color-mix(in srgb, var(--space-1) 92%, transparent); color: var(--ice);
    font-family: var(--font-display); font-weight: 700; font-size: 17px; box-shadow: 0 4px 14px color-mix(in srgb, var(--space-0) 70%, transparent);
  }
  .backbtn:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }
  #overlay.has-back { padding-top: 68px; }
  .dcollect:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }
  .dwait { flex: none; font-size: 11px; font-weight: 600; color: var(--ink-dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .dnote { width: 100%; max-width: 30rem; margin: -6px 0 14px; font-size: 13px; line-height: 1.4; color: var(--ink-dim); }
  .dnote .dcollect { margin: 4px 3px 0; vertical-align: middle; }
  .tabs { width: 100%; max-width: 30rem; display: flex; margin: 18px 0 16px; border-bottom: 1.5px solid var(--track); }
  .tab {
    position: relative; flex: 1; padding: 10px 8px 9px; margin-bottom: -1.5px; border: 0; border-bottom: 3px solid transparent; cursor: pointer;
    background: transparent; color: var(--ink-dim); font-family: var(--font-display); font-weight: 700; font-size: 19px;
  }
  .tab[aria-selected="true"] { color: var(--gold); border-bottom-color: var(--gold); }
  .tab:focus-visible { outline: 3px solid var(--ice); outline-offset: -3px; }
  .tab .dot { top: 8px; right: calc(50% - 46px); }
  .has-dot { position: relative; }
  .dot { position: absolute; top: -5px; right: -5px; width: 13px; height: 13px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 2.5px var(--space-0); }
  button.item { font: inherit; color: inherit; cursor: pointer; }
  button.item:hover { box-shadow: 0 0 14px color-mix(in srgb, var(--t) 45%, transparent); }
  button.item:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }
  .viewer { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: color-mix(in srgb, var(--space-0) 82%, transparent); }
  .viewer[hidden] { display: none; }
  .viewer .prize { margin: 0; max-width: 22rem; }
  .viewer .prize img, .viewer .prize svg { width: 200px; height: 200px; }
  .viewer .prize .btn { margin-top: 14px; }
  .coinhelp { max-width: 24rem; margin: 10px 0 0; padding: 10px 14px; border-radius: 12px; background: var(--cell); }
  .btn.small { min-height: 42px; padding: 6px 18px; font-size: 16px; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }

  /* Rewards: odds chips, the collection book, and the box opening. */
  .odds { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; }
  .odds span { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1.5px solid var(--t); color: var(--t); }
  .book { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; width: 100%; margin-top: 4px; }
  .item {
    position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px;
    border-radius: 14px; border: 2px solid var(--t); background: color-mix(in srgb, var(--t) 14%, var(--space-1));
  }
  .item.locked { border-style: dashed; border-color: var(--track); background: var(--space-1); }
  .item svg, .item img { width: 64px; height: 64px; }
  .item b { font-family: var(--font-display); font-size: 13px; line-height: 1.15; }
  .item small { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--t); }
  .item.locked small, .item.locked b { color: var(--ink-dim); }
  .item img.sil { filter: brightness(0) invert(1); opacity: .14; }
  .item .n { position: absolute; top: 4px; right: 6px; font-family: var(--font-display); font-weight: 700; font-size: 12px; color: var(--t); }
  .mbox { width: 150px; height: 150px; margin: 30px 0 10px; animation: rattle 1.1s ease-in both; }
  @keyframes rattle {
    0% { transform: scale(.6) rotate(0); } 15% { transform: scale(1) rotate(-6deg); } 30% { transform: rotate(7deg); }
    45% { transform: rotate(-9deg); } 60% { transform: rotate(10deg); } 75% { transform: scale(1.05) rotate(-12deg); }
    90% { transform: scale(1.2) rotate(0); } 100% { transform: scale(1.35); opacity: 0; }
  }
  .prize {
    position: relative; display: flex; flex-direction: column; align-items: center; margin-top: 18px; padding: 22px 34px 18px;
    border-radius: 22px; border: 3px solid var(--t); background: color-mix(in srgb, var(--t) 18%, var(--space-1));
    box-shadow: 0 0 40px color-mix(in srgb, var(--t) 55%, transparent); animation: pop .45s ease-out;
  }
  .prize svg, .prize img { position: relative; width: 140px; height: 140px; }
  .rays { position: relative; display: flex; justify-content: center; }
  .rays .prize { z-index: 1; }
  .rays::before {
    content: ''; position: absolute; left: 50%; top: 50%; width: 520px; height: 520px; margin: -260px 0 0 -260px; border-radius: 50%; z-index: 0;
    -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); mask: radial-gradient(circle, #000 30%, transparent 70%);
    background: repeating-conic-gradient(color-mix(in srgb, var(--gold) 35%, transparent) 0 12deg, transparent 12deg 30deg);
    animation: spin 8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tierlabel { margin: 0 0 6px; font-size: 14px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--t); }
  .badge { margin-top: 8px; padding: 3px 12px; border-radius: 999px; background: var(--t); color: var(--space-0); font-family: var(--font-display); font-weight: 700; font-size: 15px; }

  .earn { width: 100%; max-width: 22rem; margin-top: 18px; }
  .earn-total { margin: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 34px; color: var(--gold); }
  .earn-list { list-style: none; margin: 10px 0 0; padding: 0; font-size: 15px; text-align: left; }
  .earn-list li { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--track); }
  .earn-list b { font-family: var(--font-display); color: var(--gold); }
  .sec { margin: 26px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .chip {
    padding: 4px 11px; border-radius: 999px; background: var(--cell-alt); color: var(--ink);
    font-family: var(--font-display); font-weight: 700; font-size: 16px; white-space: nowrap;
  }
  .chip.good { background: var(--mint); color: var(--space-0); }
  .chip.ok { background: var(--gold); color: var(--on-gold); }
  .chip.bad { background: var(--coral); color: var(--space-0); }

  .runs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 100%; }
  .run {
    min-height: 56px; border-radius: 12px; border: 1.5px solid var(--track); background: var(--space-1); color: var(--gold);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer;
    font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1;
  }
  .run small { font-family: var(--font-ui); font-weight: 600; font-size: 11px; color: var(--ink-dim); }
  .run:hover { border-color: var(--gold); }
  .run:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }

  .grid { display: grid; gap: 2px; width: 100%; margin-top: 8px; }
  .grid span {
    aspect-ratio: 1; display: grid; place-items: center; border-radius: 4px;
    font-size: clamp(9px, 2.6vw, 12px); font-variant-numeric: tabular-nums;
    background: var(--cell); color: var(--ink-dim);
  }
  .grid .h { background: transparent; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: clamp(11px, 3vw, 14px); }
  .grid .good { background: var(--mint); color: var(--space-0); }
  .grid .ok { background: var(--gold); color: var(--on-gold); }
  .grid .bad { background: var(--coral); color: var(--space-0); }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--ink-dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--cell); }
  .legend .good { background: var(--mint); }
  .legend .ok { background: var(--gold); }
  .legend .bad { background: var(--coral); }
  .slot.miss { border-style: solid; border-color: var(--coral); background: var(--coral); color: var(--space-0); }


  @media (prefers-reduced-motion: reduce) {
    #app.shake { animation: none; }
    #flash.hit { animation-duration: .15s; }
    .slot.pop { animation: none; }
    .mbox { animation-duration: .3s; }
    .rays::before { animation: none; }
    .dbar .dcollect { animation: none; box-shadow: 0 0 12px 3px color-mix(in srgb, var(--gold) 55%, transparent); }
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="stage" role="img" aria-label="Game field"></canvas>

  <div id="hud">
    <div class="bar">
      <div class="shields" id="shields" role="img" aria-label="Shields"></div>
      <span class="pilot" id="pilot"></span>
      <span class="purse" id="purse" aria-label="Coins this game"><span class="coin"></span><span id="coins">0</span></span>
      <div class="tally" aria-label="Pairs caught"><span id="done">0</span><span class="of">/10</span></div>
      <button id="mute" type="button" aria-label="Turn sound off">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/>
          <g class="waves"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></g>
          <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
      <button id="quit" type="button" aria-label="Quit game" title="Quit game">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="powers" id="powers"></div>
    <div class="target" aria-live="polite">
      <div class="label" id="label">Catch two numbers that multiply to</div>
      <div class="num" id="target">42</div>
      <div class="eq">
        <div class="slot" id="slotA">?</div>
        <div class="times" id="times">×</div>
        <div class="slot" id="slotB">?</div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="arrow" id="btnL" type="button" aria-label="Move left">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div id="track" title="Slide to steer"><div id="thumb"></div></div>
    <button class="arrow" id="btnR" type="button" aria-label="Move right">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div id="flash"></div>
  <div id="overlay"></div>
  <div id="confirm" class="confirm" role="dialog" aria-modal="true" aria-labelledby="confirmTitle" hidden>
    <div class="confirm-card">
      <h2 id="confirmTitle">Quit this game?</h2>
      <p class="hint">The game is paused. You keep the coins you earned so far.</p>
      <div class="actions">
        <button class="btn" type="button" id="keepFlying">Keep flying</button>
        <button class="btn danger" type="button" id="quitYes">Quit</button>
      </div>
    </div>
  </div>

</div>

<script>
(() => {
  'use strict';

  // MIN and MAX set which times tables show up. ROUNDS is facts per mission.
  // HISTORY is how many recent answers per fact count toward progress; older ones are dropped.
  const CFG = { MIN: 2, MAX: 12, ROUNDS: 10, SHIELDS: 3, HISTORY: 10, LANES: 4 };
  const LIM = 0.9;
  const PLAYERS = ['Mason', 'Macauley', 'Mom', 'Dad'];
  const PKEY = 'factor-flight-players';

  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  };
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  const cs = getComputedStyle(document.documentElement);
  const tok = n => cs.getPropertyValue(n).trim();
  const COL = {
    space0: tok('--space-0'), space1: tok('--space-1'), ink: tok('--ink'),
    gold: tok('--gold'), goldLight: tok('--gold-light'), onGold: tok('--on-gold'),
    ice: tok('--ice'), coral: tok('--coral'), mint: tok('--mint'), violet: tok('--violet'),
    orange: tok('--orange'), pink: tok('--pink'), blue: tok('--blue')
  };
  const PLANETS = [COL.violet, COL.mint, COL.orange, COL.pink, COL.blue];
  const STAR_TINTS = [COL.ink, COL.ink, COL.ice, COL.gold];
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  };
  const FONT = "'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif";

  const app = $('app'), cv = $('stage'), ctx = cv.getContext('2d');
  const overlay = $('overlay'), hud = $('hud'), flashEl = $('flash');

  // ---------- layout ----------
  let W = 0, H = 0, dpr = 1, vpX = 0, vpY = 0, shipY = 0, halfW = 0, objR = 26;
  let bgGrad, nebA, nebB, glow;

  function resize() {
    const r = app.getBoundingClientRect();
    W = r.width; H = r.height;
    if (!W || !H) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const hudBottom = hud.getBoundingClientRect().bottom - r.top;
    vpX = W / 2;
    vpY = clamp(hudBottom + 36, H * 0.3, H * 0.46);
    // The ship sits above the steering bar so a thumb on the bar never covers it.
    shipY = H - $('controls').getBoundingClientRect().height - 52;
    halfW = W / 2 - 12;
    objR = clamp(W * 0.07, 20, 34);

    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, COL.space0);
    bgGrad.addColorStop(1, COL.space1);
    nebA = ctx.createRadialGradient(W * 0.88, H * 0.58, 0, W * 0.88, H * 0.58, W * 0.9);
    nebA.addColorStop(0, rgba(COL.violet, 0.2)); nebA.addColorStop(1, rgba(COL.violet, 0));
    nebB = ctx.createRadialGradient(W * 0.06, H * 0.4, 0, W * 0.06, H * 0.4, W * 0.8);
    nebB.addColorStop(0, rgba(COL.mint, 0.13)); nebB.addColorStop(1, rgba(COL.mint, 0));
    glow = ctx.createRadialGradient(vpX, vpY, 0, vpX, vpY, W * 0.75);
    glow.addColorStop(0, rgba(COL.gold, 0.3)); glow.addColorStop(0.18, rgba(COL.gold, 0.1)); glow.addColorStop(1, rgba(COL.gold, 0));
  }

  // ---------- perspective ----------
  // u runs 0 (at the vanishing point) to 1 (level with the ship) and beyond (passing under it).
  function project(wx, u) {
    const f = Math.pow(u, 1.5);
    const k = 0.35 + 0.65 * f;
    return { x: vpX + wx * halfW * k, y: vpY + (shipY - vpY) * f, k };
  }

  // ---------- audio ----------
  let actx = null, muted = false;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  }
  function tone(freq, dur, type, vol, delay, slideTo) {
    if (!actx || muted) return;
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  const sfx = {
    pick() { tone(660, 0.1, 'triangle', 0.12); tone(990, 0.14, 'triangle', 0.1, 0.07); },
    wrong() { tone(170, 0.3, 'sawtooth', 0.09, 0, 80); },
    round() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.11, i * 0.08)); },
    win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.24, 'triangle', 0.12, i * 0.11)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.26, 'sine', 0.12, i * 0.15)); }
  };
  $('mute').addEventListener('click', () => {
    muted = !muted;
    $('mute').classList.toggle('off', muted);
    $('mute').setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
    music.applyGain();
    if (!muted) { ensureAudio(); sfx.pick(); }
  });

  // ---------- players ----------
  // Per player: games and wins (missions), best mission time, best speedrun time per table (speed),
  // and for each fact ("3x7", smaller number first) h = the last CFG.HISTORY answers, '1' right and '0' wrong.
  let player = null;
  const db = (() => {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(PKEY)); } catch (e) {}
    if (!d || typeof d !== 'object') d = {};
    // Older saves kept lifetime right and wrong counts. Keep only the recent history.
    Object.keys(d).forEach(name => {
      const facts = (d[name] && d[name].facts) || {};
      Object.keys(facts).forEach(k => {
        const h = facts[k] && facts[k].h;
        if (h) facts[k] = { h: String(h).slice(-CFG.HISTORY) }; else delete facts[k];
      });
    });
    return d;
  })();
  const saveDb = () => { try { localStorage.setItem(PKEY, JSON.stringify(db)); } catch (e) {} };
  function rec(name) {
    const r = db[name] || (db[name] = {});
    r.games = r.games || 0; r.wins = r.wins || 0; r.best = r.best || null;
    r.facts = r.facts || {}; r.speed = r.speed || {};
    r.coins = r.coins || 0; r.coinsEarned = r.coinsEarned || 0; r.collection = r.collection || {};
    if (!PACES[r.pace]) r.pace = 'fast';
    r.daily = r.daily || { day: 0, streak: 0 };
    r.owned = r.owned || {}; r.shipLevel = r.shipLevel || 1; r.shipColor = r.shipColor || ''; r.song = r.song || 'loop';
    return r;
  }
  const factKey = (a, b) => Math.min(a, b) + 'x' + Math.max(a, b);
  // Returns the fact's key and its level before and after this answer.
  function logFact(a, b, ok) {
    const k = factKey(a, b);
    if (!player) return { k, before: '', after: '' };
    const facts = rec(player).facts;
    const e = facts[k] || (facts[k] = { h: '' });
    const before = factLevel(e);
    e.h = (e.h + (ok ? '1' : '0')).slice(-CFG.HISTORY);
    saveDb();
    return { k, before, after: factLevel(e) };
  }
  const pct = e => e && e.h ? e.h.split('').filter(c => c === '1').length / e.h.length : 0;
  // Mastery from the recent answers only, so old mistakes fade once a fact is learned.
  function factLevel(e) {
    if (!e || !e.h) return '';
    const p = pct(e);
    if (e.h.length >= 3 && p >= 0.8) return 'good';
    return p >= 0.5 ? 'ok' : 'bad';
  }
  function allFacts() {
    const out = [];
    for (let a = CFG.MIN; a <= CFG.MAX; a++) for (let b = a; b <= CFG.MAX; b++) out.push([a, b]);
    return out;
  }
  // A mission picks CFG.ROUNDS facts: the shakiest ones first (needs practice, then learning),
  // up to 8 of them, then facts not seen yet, then known facts with the lowest score as review.
  function planMission(name) {
    const facts = rec(name).facts;
    const all = allFacts().map(([a, b]) => { const e = facts[factKey(a, b)]; return { a, b, e, lv: factLevel(e), r: Math.random() }; });
    const trouble = all.filter(f => f.lv === 'bad' || f.lv === 'ok')
      .sort((x, y) => (x.lv === 'bad' ? 0 : 1) - (y.lv === 'bad' ? 0 : 1) || pct(x.e) - pct(y.e) || x.r - y.r);
    const fresh = shuffle(all.filter(f => !f.lv));
    const known = all.filter(f => f.lv === 'good').sort((x, y) => pct(x.e) - pct(y.e) || x.r - y.r);
    const plan = trouble.slice(0, 8);
    for (const f of fresh.concat(trouble.slice(8), known)) { if (plan.length >= CFG.ROUNDS) break; plan.push(f); }
    return plan;
  }

  // ---------- coins ----------
  // Coins reward learning more than grinding: tricky facts pay more than known ones, a fact turning
  // green pays the most, and missions pay more than replaying an easy speedrun.
  const COINS = {
    tricky: 5,    // right answer on a fact that was not known when the game started
    known: 2,     // right answer on a fact that was already known
    firstTry: 2,  // question answered with no wrong catch
    mastered: 10, // a fact turned green this game
    mission: 20,  // finishing a mission
    shield: 5,    // each shield left at the end of a mission
    speedrun: 10, // finishing a speedrun
    perfect: 15,  // speedrun with no misses
    best: 10,     // new best time
    fastBonus: 0.2 // extra share of a game's coins when flying at Fast speed
  };
  const REASONS = {
    tricky: 'Tricky facts', known: 'Known facts', firstTry: 'First try', mastered: 'Newly mastered',
    mission: 'Mission complete', shield: 'Shields left', speedrun: 'Speedrun done', perfect: 'Perfect run', best: 'New best time', fast: 'Fast speed bonus'
  };
  // This game's coins by reason. They are banked into the wallet when the game ends.
  let earned = {}, startLevels = {}, masteredNow = new Set();
  const earnedTotal = () => Object.keys(earned).reduce((t, k) => t + earned[k].coins, 0);
  function award(reason, times) {
    times = times || 1;
    if (times <= 0) return;
    const e = earned[reason] || (earned[reason] = { count: 0, coins: 0 });
    e.count += times; e.coins += COINS[reason] * times;
    $('coins').textContent = earnedTotal();
    const purse = $('purse');
    purse.classList.remove('pop'); void purse.offsetWidth; purse.classList.add('pop');
  }
  // Pay for one answer. Levels come from the start of the game, so missing on purpose
  // and then answering right never pays more.
  function payAnswer(lv, ok, clean) {
    if (!(lv.k in startLevels)) startLevels[lv.k] = lv.before;
    if (!ok) return;
    const start = startLevels[lv.k];
    award(start === 'good' ? 'known' : 'tricky');
    if (clean) award('firstTry');
    if (lv.after === 'good' && start !== 'good' && !masteredNow.has(lv.k)) { masteredNow.add(lv.k); award('mastered'); }
  }
  // Wallet, for the rewards screen to spend from.
  const wallet = {
    balance: name => rec(name).coins,
    add(name, n) { const r = rec(name); r.coins += n; r.coinsEarned += n; saveDb(); },
    spend(name, n) {
      const r = rec(name);
      if (!(n > 0) || r.coins < n) return false;
      r.coins -= n; saveDb();
      return true;
    }
  };
  window.FactorFlight = { wallet, get player() { return player; } };
  function bankCoins() {
    if (pace === 'fast' && earnedTotal() > 0) earned.fast = { count: 1, coins: Math.round(earnedTotal() * COINS.fastBonus) };
    wallet.add(player, earnedTotal());
    const r = rec(player);
    const rows = Object.keys(REASONS).filter(k => earned[k]).map(k =>
      '<li><span>' + REASONS[k] + (earned[k].count > 1 ? ' × ' + earned[k].count : '') + '</span><b>+' + earned[k].coins + '</b></li>').join('');
    return '<div class="earn"><p class="earn-total"><span class="coin"></span>+' + earnedTotal() + '</p>' +
      (rows ? '<ul class="earn-list">' + rows + '</ul>' : '') +
      '<p class="hint">' + player + ' has ' + r.coins + ' coins.</p></div>';
  }

  // ---------- rewards ----------
  // Gacha rewards. Tier chances must add up to 1. Colors are CSS tokens.
  // An item with src shows that image (a path like 'rewards/common/green-slime.svg', no leading slash).
  // The art lives in the rewards folder; replace a file there to change a creature.
  // An item without src gets a simple placeholder creature drawn by creatureSvg in its color.
  const REWARDS = {
    price: 100,
    tiers: {
      common: { chance: 0.70, color: 'var(--tier-common)', label: 'Common' },
      rare: { chance: 0.20, color: 'var(--tier-rare)', label: 'Rare' },
      epic: { chance: 0.09, color: 'var(--tier-epic)', label: 'Epic' },
      legendary: { chance: 0.01, color: 'var(--tier-legendary)', label: 'Legendary' }
    },
    items: [
      { id: 'rwd_001', name: 'Green Slime', tier: 'common', src: 'rewards/common/green-slime.svg', color: 'mint' },
      { id: 'rwd_002', name: 'Moon Blob', tier: 'common', src: 'rewards/common/moon-blob.svg', color: 'ice' },
      { id: 'rwd_003', name: 'Dust Bunny', tier: 'common', src: 'rewards/common/dust-bunny.svg', color: 'pink' },
      { id: 'rwd_004', name: 'Pebble Pup', tier: 'common', src: 'rewards/common/pebble-pup.svg', color: 'orange' },
      { id: 'rwd_005', name: 'Bubble Bug', tier: 'common', src: 'rewards/common/bubble-bug.svg', color: 'blue' },
      { id: 'rwd_011', name: 'Comet Cat', tier: 'rare', src: 'rewards/rare/comet-cat.svg', color: 'ice' },
      { id: 'rwd_012', name: 'Star Squid', tier: 'rare', src: 'rewards/rare/star-squid.svg', color: 'pink' },
      { id: 'rwd_013', name: 'Rocket Otter', tier: 'rare', src: 'rewards/rare/rocket-otter.svg', color: 'orange' },
      { id: 'rwd_014', name: 'Nebula Newt', tier: 'rare', src: 'rewards/rare/nebula-newt.svg', color: 'violet' },

      { id: 'rwd_042', name: 'Golden Dragon', tier: 'legendary', src: 'rewards/legendary/golden-dragon.svg', color: 'gold' }
    ]
  };

  // Ken's roll logic: pick a tier by cumulative chance, then an item from that tier.
  function openLootBox(database) {
    const roll = Math.random();
    let cumulativeChance = 0;
    let winningTier = 'common'; // fallback if rounding leaves the roll past the last tier
    for (const [tierName, tierData] of Object.entries(database.tiers)) {
      cumulativeChance += tierData.chance;
      if (roll < cumulativeChance) { winningTier = tierName; break; }
    }
    const possibleItems = database.items.filter(item => item.tier === winningTier);
    if (possibleItems.length === 0) {
      console.warn('No items found for tier: ' + winningTier);
      const item = database.items[0];
      return { ...item, theme: database.tiers[item.tier] };
    }
    const wonItem = possibleItems[Math.floor(Math.random() * possibleItems.length)];
    return { ...wonItem, theme: database.tiers[winningTier] };
  }

  // Placeholder art: a little creature whose body shape comes from its position in the list
  // and whose extras come from its tier (antennae, horns, crown). Locked items draw as a "?" shadow.

    if (item.tier === 'epic') back = '<path d="M28 36 22 10l20 18zM72 36l6-26-20 18z"/>';
    if (item.tier === 'legendary') front = '<path d="M33 26 36 8l9 11 5-13 5 13 9-11 3 18z" fill="' + COL.gold + '" stroke="' + COL.onGold + '" stroke-width="2" stroke-linejoin="round"/>';
    const face = locked
      ? '<text x="50" y="68" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="34" fill="' + COL.ink + '" opacity=".5">?</text>'
      : '<circle cx="39" cy="52" r="9" fill="#fff"/><circle cx="61" cy="52" r="9" fill="#fff"/>' +

  }
  // Locked items with art show as a faint silhouette of the creature.
  const itemArt = (item, locked) => item.src
    ? '<img src="' + item.src + '" alt=""' + (locked ? ' class="sil"' : '') + ' width="64" height="64">'
    : creatureSvg(item, locked);
  const BOX_SVG = '<svg class="mbox" viewBox="0 0 100 100" aria-hidden="true">' +
    '<rect x="14" y="34" width="72" height="54" rx="8" fill="' + COL.violet + '"/><rect x="10" y="24" width="80" height="18" rx="6" fill="' + COL.pink + '"/>' +
    '<rect x="44" y="24" width="12" height="64" fill="' + COL.gold + '"/>' +
    '<path d="M50 24c-6-14-24-14-20-2 2 5 12 4 20 2zm0 0c6-14 24-14 20-2-2 5-12 4-20 2z" fill="' + COL.gold + '"/>' +
    '<text x="50" y="75" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="22" fill="' + COL.space0 + '">?</text></svg>';
  const tierStyle = tier => ' style="--t: ' + REWARDS.tiers[tier].color + '"';

  // Rewards page: daily pay bar on top, then two tabs, Collection (open boxes, the creature book)
  // and Hangar (ship upgrades, songs, power-ups).
  let rewardsTab = 'collection';
  function showRewards(name, tab, keepScroll) {
    player = name;
    rewardsTab = tab || 'collection';
    stopPreview();
    const r = rec(name), hangar = rewardsTab === 'hangar';
    const tabBtn = (id, label, dot) => '<button type="button" role="tab" class="tab" data-act="tab" data-tab="' + id + '" aria-selected="' + (rewardsTab === id) + '">' +

    showPanel(

      '<p class="wallet" aria-label="' + r.coins + ' coins"><span class="coin"></span>' + r.coins + '</p></div>' +
      '<div class="tabs" role="tablist" aria-label="Rewards">' + tabBtn('collection', 'Collection') + tabBtn('hangar', 'Hangar', canBuy(r)) + '</div>' +
      (hangar ? hangarHtml(r) : collectionHtml(r)) +
      '<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerName" hidden></div>',
      {
        tab: el => showRewards(name, el.dataset.tab),
        open: () => openReward(name),
        view: el => viewItem(r, el.dataset.id),
        daily: () => { if (claimDaily(r)) { ensureAudio(); sfx.round(); showRewards(name, rewardsTab, true); } },
        keepstreak: () => { if (keepStreak(r)) showRewards(name, rewardsTab, true); },
        startover: () => { r.daily = { day: 0, streak: 0 }; saveDb(); showRewards(name, rewardsTab, true); },
        buy: el => { if (hangarBuy(r, el)) { ensureAudio(); sfx.round(); showRewards(name, 'hangar', true); } },
        use: el => { r.song = el.dataset.id; saveDb(); showRewards(name, 'hangar', true); },
        paint: el => { r.shipColor = el.dataset.color; saveDb(); showRewards(name, 'hangar', true); },
        listen: el => {
          const id = el.dataset.id, again = previewing === id;
          stopPreview();
          [].forEach.call(overlay.querySelectorAll('[data-act=listen]'), b => { b.textContent = 'Listen'; });
          if (again) return;
          ensureAudio(); useSong(id); music.setFactor(1); music.start();
          previewing = id; el.textContent = 'Stop';
        }
      },
      { wide: hangar, solid: true, keepScroll, back: { label: 'Back', on: () => showProfile(name) } }
    );
  }

  function collectionHtml(r) {
    const have = Object.keys(r.collection).length, can = r.coins >= REWARDS.price;
    const odds = Object.keys(REWARDS.tiers).map(t =>
      '<span' + tierStyle(t) + '>' + REWARDS.tiers[t].label + ' ' + Math.round(REWARDS.tiers[t].chance * 100) + '%</span>').join('');
    // Found creatures are buttons that open a big view; the rest stay as silhouettes.
    const book = REWARDS.items.map(it => {
      const n = r.collection[it.id] || 0;
      const inner = (n > 1 ? '<span class="n">×' + n + '</span>' : '') + itemArt(it, !n) +
        '<b>' + (n ? it.name : '???') + '</b><small>' + REWARDS.tiers[it.tier].label + '</small>';
      return n ? '<button type="button" class="item" data-act="view" data-id="' + it.id + '" aria-label="View ' + it.name + '"' + tierStyle(it.tier) + '>' + inner + '</button>'
        : '<div class="item locked"' + tierStyle(it.tier) + '>' + inner + '</div>';
    }).join('');
    return btn('Open reward · ' + REWARDS.price, 'open', 'big', can ? '' : ' disabled') +
      '<p class="hint">' + (can ? 'Each reward costs ' + REWARDS.price + ' coins.' : 'Earn ' + (REWARDS.price - r.coins) + ' more coins to open a reward.') + '</p>' +
      '<div class="odds">' + odds + '</div>' +
      '<p class="sec">Collection · ' + have + '/' + REWARDS.items.length + (have ? ' · tap one to look closer' : '') + '</p>' +
      '<div class="book">' + book + '</div>';
  }

  // Big view of a found creature, over the Rewards page.
  function viewItem(r, id) {
    const it = REWARDS.items.find(x => x.id === id), v = $('viewer');
    if (!it || !v) return;
    const n = r.collection[id] || 0;
    v.innerHTML = '<div class="prize"' + tierStyle(it.tier) + '><p class="tierlabel">' + REWARDS.tiers[it.tier].label + '</p>' + itemArt(it) +
      '<h1 id="viewerName">' + it.name + '</h1><span class="badge">You have ' + n + '</span>' +
      '<button type="button" class="btn ghost small" id="viewerClose">Close</button></div>';
    v.hidden = false;
    $('viewerClose').addEventListener('click', closeViewer);
    try { $('viewerClose').focus({ preventScroll: true }); } catch (e) {}
  }
  function closeViewer() {
    const v = $('viewer');
    if (!v || v.hidden) return false;
    v.hidden = true; v.innerHTML = '';
    return true;
  }
  overlay.addEventListener('click', e => { if (e.target.id === 'viewer') closeViewer(); });

  function openReward(name) {
    if (!wallet.spend(name, REWARDS.price)) { showRewards(name); return; }
    ensureAudio();
    const r = rec(name), item = openLootBox(REWARDS);
    r.collection[item.id] = (r.collection[item.id] || 0) + 1;
    r.opened = (r.opened || 0) + 1;
    saveDb();
    const n = r.collection[item.id];
    // Rattle the box, then reveal the prize.
    showPanel('<p class="kicker">Opening</p>' + BOX_SVG, {}, { solid: true });
    sfx.pick();
    setTimeout(() => {
      if (item.tier === 'legendary' || item.tier === 'epic') sfx.win(); else sfx.round();
      const again = r.coins >= REWARDS.price;
      showPanel(
        (item.tier === 'legendary' ? '<div class="rays">' : '<div>') +
        '<div class="prize"' + tierStyle(item.tier) + '>' +
          '<p class="tierlabel">' + item.theme.label + ' unlocked!</p>' + itemArt(item) +
          '<h1>' + item.name + '</h1>' +
          '<span class="badge">' + (n === 1 ? 'New!' : 'You have ' + n) + '</span>' +
        '</div></div>' +
        '<p class="hint">' + name + ' has ' + r.coins + ' coins.</p>' +
        '<div class="actions">' + (again ? btn('Open another · ' + REWARDS.price, 'open') : '') + btn('Collection', 'book', again ? 'ghost' : '') + '</div>',
        { open: () => openReward(name), book: () => showRewards(name) },
        { solid: true }
      );
    }, reduce ? 350 : 1100);
  }

  // ---------- state ----------
  let state = 'ready'; // ready | playing | interlude | won | lost
  const ship = { wx: 0, target: 0, bank: 0, pulse: 0, pulseCol: COL.gold };
  let objs = [], parts = [], stars = [];
  let round = null, done = 0, shields = CFG.SHIELDS, maxShields = CFG.SHIELDS, wrongCount = 0, kinds = [];
  let spawnT = 0, sinceNeeded = 0, interludeT = 0, tAnim = 0, warp = 0.6, worldAlpha = 1, startTime = 0;
  // The game timer leaves out time spent paused (quit dialog) or frozen (Freeze power-up).
  let paused = false, pauseAt = 0, pausedMs = 0;
  const gameSeconds = () => (performance.now() - startTime - pausedMs - (paused ? performance.now() - pauseAt : 0)) / 1000;
  // mode 'mission': plan is the list of facts, one per round.
  // mode 'speed': speedN is the chosen table, queue holds the other factors still to answer right.
  let mode = 'mission', plan = [], speedN = 0, queue = [], missed = new Set(), total = CFG.ROUNDS;

  const progress = () => clamp(done / Math.max(1, total - 1), 0, 1);
  // Speed choice per player: Fast is the full speed, Medium is 20% slower, Slowish is 50% slower.
  const PACES = { fast: { speed: 1, label: 'Fast' }, medium: { speed: 0.8, label: 'Medium' }, slow: { speed: 0.5, label: 'Slowish' } };
  let pace = 'fast';
  const travelTime = () => (mode === 'speed' ? lerp(3.4, 2.4, progress()) : lerp(5.0, 3.8, progress())) / PACES[pace].speed;
  const spawnEvery = () => travelTime() / 5;

  // Speedrun lanes, in world x.
  const laneX = i => lerp(-0.72, 0.72, i / (CFG.LANES - 1));
  const nearestLane = wx => clamp(Math.round((wx + 0.72) / 1.44 * (CFG.LANES - 1)), 0, CFG.LANES - 1);
  const stepLane = d => { ship.target = laneX(clamp(nearestLane(ship.target) + d, 0, CFG.LANES - 1)); };

  // ---------- HUD ----------
  const SHIELD_SVG = '<svg class="shield" viewBox="0 0 20 22" aria-hidden="true"><path d="M10 1.5 18 4.5v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10v-6z" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  function setupHud() {
    $('shields').innerHTML = SHIELD_SVG.repeat(maxShields);
    $('meter').innerHTML = '<i></i>'.repeat(total);
    document.querySelector('.tally .of').textContent = '/' + total;
    $('shields').style.visibility = mode === 'speed' ? 'hidden' : '';
  }
  setupHud();

  function setSlot(el, val, pop) {
    if (val === null || val === undefined) {
      el.textContent = '?'; el.classList.remove('filled', 'pop');
    } else {
      el.textContent = val; el.classList.add('filled');
      if (pop) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    }
  }
  function renderHud(popA, popB) {
    const kind = round.kind, single = kind !== 'factors';
    $('target').textContent = kind === 'product' ? round.a + ' × ' + round.b
      : kind === 'missing' ? round.a + ' × ? = ' + round.product : round.product;
    $('target').classList.toggle('term', kind === 'product');
    $('target').classList.toggle('term-long', kind === 'missing');
    const verb = mode === 'speed' ? 'Fly into ' : 'Catch ';
    $('label').textContent = kind === 'product' ? verb + 'the answer to'
      : kind === 'missing' ? verb + 'the missing number' : 'Catch two numbers that multiply to';
    $('slotA').hidden = single;
    $('times').hidden = single;
    setSlot($('slotA'), round.picked, popA);
    setSlot($('slotB'), round.complete || round.missed ? (single ? round.answer : round.need) : null, popB);
    $('slotB').classList.toggle('miss', !!round.missed);
    hud.classList.toggle('done', !!round.complete);
    $('done').textContent = done;
    [].forEach.call($('meter').children, (el, i) => el.classList.toggle('on', i < done));
    [].forEach.call($('shields').children, (el, i) => el.classList.toggle('lost', i >= shields));
  }

  // ---------- rounds ----------
  function newRound() {
    let a, b, k = 0, KINDS;
    if (mode === 'speed') {
      k = queue.shift(); a = speedN; b = k;
      KINDS = ['product', 'missing'];
    } else {
      const f = plan[done] || { a: randInt(CFG.MIN, CFG.MAX), b: randInt(CFG.MIN, CFG.MAX) };
      a = f.a; b = f.b;
      KINDS = ['factors', 'product', 'missing'];
    }
    // Round types mixed at random, rarely repeating and never three of the same kind in a row.
    const last = kinds[kinds.length - 1];
    let kind = pick(KINDS);
    if (kind === last && (kinds[kinds.length - 2] === last || Math.random() < 0.6)) kind = pick(KINDS.filter(x => x !== last));
    kinds.push(kind);
    // A speedrun missing-number question always shows the chosen table, so the answer is the other factor.
    if (!(mode === 'speed' && kind === 'missing') && Math.random() < 0.5) [a, b] = [b, a];
    const p = a * b;
    round = {
      kind, product: p, a, b, k, valid: [], pool: [], picked: null, need: null, complete: false, missed: false, spawned: false, w0: wrongCount,
      answer: kind === 'product' ? p : kind === 'missing' ? b : null
    };
    if (kind === 'factors') {
      for (let d = CFG.MIN; d <= CFG.MAX; d++) {
        if (p % d === 0) { const q = p / d; if (q >= CFG.MIN && q <= CFG.MAX) round.valid.push(d); }
      }
    } else if (kind === 'product') {
      // Wrong answers a learner might really pick, plus a few random products.
      const near = [a * (b - 1), a * (b + 1), (a - 1) * b, (a + 1) * b, a + b, p - 10, p + 10, p - 1, p + 1];
      const nearOk = near.filter((v, i) => v >= 2 && v !== p && near.indexOf(v) === i);
      const rand = [];
      for (let i = 0; i < 4; i++) {
        const v = randInt(CFG.MIN, CFG.MAX) * randInt(CFG.MIN, CFG.MAX);
        if (v !== p) rand.push(v);
      }
      round.pool = nearOk.concat(nearOk, rand);
    } else {
      // Wrong factors a learner might pick: neighbours of the answer, the known factor, or subtracting instead of dividing.
      const near = [b - 1, b + 1, b - 2, b + 2, a, p - a];
      const nearOk = near.filter((v, i) => v >= 2 && v !== b && near.indexOf(v) === i);
      const rand = [];
      for (let i = 0; i < 3; i++) {
        const v = randInt(CFG.MIN, CFG.MAX);
        if (v !== b) rand.push(v);
      }
      round.pool = nearOk.concat(nearOk, rand);
    }
    objs = []; worldAlpha = 0; spawnT = mode === 'speed' ? 0.15 : 0.5; sinceNeeded = 0;
    renderHud();
  }

  function makeObj(val, wx) {
    const roll = Math.random();
    const type = roll < 0.4 ? 'star' : roll < 0.75 ? 'planet' : 'comet';
    return {
      type, val, wx, u: 0, checked: false, dead: false,
      col: type === 'star' ? COL.gold : type === 'comet' ? COL.ice : pick(PLANETS),
      ring: type === 'planet' && Math.random() < 0.5, tilt: rnd(-0.5, 0.5), spin: rnd(0.6, 1.2) * (Math.random() < 0.5 ? -1 : 1)
    };
  }

  function spawn() {
    let val;
    sinceNeeded++;
    const force = sinceNeeded >= 3 || Math.random() < 0.34;
    if (round.kind !== 'factors') {
      if (force) { val = round.answer; sinceNeeded = 0; }
      else val = pick(round.pool);
    } else {
      const needSet = round.picked === null ? round.valid : [round.need];
      if (force) { val = pick(needSet); sinceNeeded = 0; }
      else {
        const pool = [];
        for (let v = CFG.MIN; v <= CFG.MAX; v++) if (needSet.indexOf(v) < 0) pool.push(v);
        val = pick(pool);
      }
    }
    // Pick the spot farthest from the numbers already on the way. Numbers that will arrive
    // around the same time count most, so neighbours are easy to dodge.
    let bx = 0, bd = -1;
    for (let i = 0; i < 12; i++) {
      const x = rnd(-0.85, 0.85);
      let d = 9;
      for (const o of objs) if (o.u < 0.6) d = Math.min(d, Math.abs(o.wx - x) + o.u * 1.2);
      if (d > bd) { bd = d; bx = x; }
    }
    objs.push(makeObj(val, bx));
  }

  // Speedrun: one row of answers, one per lane, with the question riding on a gate above it.
  function spawnWave() {
    const wrong = [];
    const add = v => { if (v >= 1 && v !== round.answer && wrong.indexOf(v) < 0 && wrong.length < CFG.LANES - 1) wrong.push(v); };
    shuffle(round.pool.slice()).forEach(add);
    while (wrong.length < CFG.LANES - 1) add(round.kind === 'product' ? randInt(CFG.MIN, CFG.MAX) * randInt(CFG.MIN, CFG.MAX) : randInt(CFG.MIN, CFG.MAX));
    const wave = { label: round.kind === 'product' ? round.a + ' × ' + round.b : round.a + ' × ? = ' + round.product, objs: [], checked: false };
    shuffle(wrong.concat(round.answer)).forEach((val, lane) => {
      const o = makeObj(val, laneX(lane));
      o.wave = wave; o.lane = lane;
      wave.objs.push(o); objs.push(o);
    });
  }
  // The row reached the ship: whichever lane the ship is in is the answer.
  function resolveWave(w) {
    w.checked = true;
    w.objs.forEach(o => { o.checked = true; });
    // Use the lane the player steered to, even if the ship is still sliding into it.
    const o = w.objs[nearestLane(ship.target)];
    o.dead = true;
    onLane(o, vpX + o.wx * halfW, shipY);
  }

  // ---------- capture ----------
  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = rnd(70, 260);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.35, 0.7), max: 0.7, col, size: rnd(1.5, 3.5) });
    }
  }
  function floater(x, y, text, col) {
    parts.push({ x, y, vx: 0, vy: -70, life: 0.9, max: 0.9, col, text, size: objR * 1.3 });
  }

  // Each catch is logged against one fact: the round's a x b, or in a factors round
  // the pair the player is building once they have caught the first number.
  function onCapture(o, x, y) {
    const clean = () => wrongCount === round.w0;
    if (round.kind !== 'factors') {
      const ok = o.val === round.answer;
      payAnswer(logFact(round.a, round.b, ok), ok, clean());
      if (ok) {
        round.complete = true; done++;
        goodHit(o, x, y); renderHud(false, true);
        state = 'interlude'; interludeT = 1.2; sfx.round();
      } else badHit(x, y);
      return;
    }
    if (round.picked === null) {
      if (round.valid.indexOf(o.val) >= 0) {
        round.picked = o.val; round.need = round.product / o.val;
        goodHit(o, x, y); renderHud(true, false); sfx.pick();
      } else { payAnswer(logFact(round.a, round.b, false), false); badHit(x, y); }
    } else if (o.val === round.need) {
      payAnswer(logFact(round.picked, round.need, true), true, clean());
      round.complete = true; done++;
      goodHit(o, x, y); renderHud(false, true);
      state = 'interlude'; interludeT = 1.2; sfx.round();
    } else { payAnswer(logFact(round.picked, round.need, false), false); badHit(x, y); }
  }
  // A speedrun miss costs no shield. The slot shows the right answer and the question comes back later.
  function onLane(o, x, y) {
    const ok = o.val === round.answer;
    payAnswer(logFact(round.a, round.b, ok), ok, !missed.has(round.k));
    if (ok) {
      round.complete = true; done++;
      goodHit(o, x, y); renderHud(false, true); sfx.pick();
      state = 'interlude'; interludeT = 0.45;
    } else {
      round.missed = true; missed.add(round.k); queue.push(round.k);

      state = 'interlude'; interludeT = 1.0;
    }
  }
  function goodHit(o, x, y) {
    burst(x, y, o.col, 20); floater(x, y - objR, String(o.val), COL.gold);
    ship.pulse = 1; ship.pulseCol = COL.gold;
  }
  function hitFx(x, y) {
    music.duck();
    burst(x, y, COL.coral, 22);
    ship.pulse = 1; ship.pulseCol = COL.coral;
    flashEl.classList.remove('hit'); void flashEl.offsetWidth; flashEl.classList.add('hit');
    app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
  }
  function badHit(x, y) {
    shields--; wrongCount++;
