    if (shields <= 0) lose(); else sfx.wrong();
  }

  // ---------- menus and game flow ----------
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const factLabel = f => f.a + ' × ' + f.b;
  const btn = (label, act, cls, data) => '<button class="btn' + (cls ? ' ' + cls : '') + '" type="button" data-act="' + act + '"' + (data || '') + '>' + label + '</button>';
  const statsHtml = stats => '<dl class="stats">' + stats.map(s => '<div><dt>' + s[0] + '</dt><dd>' + s[1] + '</dd></div>').join('') + '</dl>';
  // Shown on end screens once the coins are banked and there are enough for a reward.
  const rewardBtn = () => wallet.balance(player) >= REWARDS.price ? btn('Open a reward', 'rewards', 'ghost') : '';
  const head = (kicker, title) => '<p class="kicker">' + kicker + '</p><h1>' + title + '</h1>';

  // Every clickable element with data-act="name" calls acts[name](element).
  // Focus goes to the element marked data-focus, or else the first one.
  // opts.back = { label, on } adds a Back button that floats in the top left (Escape works too).
  const BACK_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  let panelBack = null;
  function showPanel(html, acts, opts) {
    opts = opts || {};
    stopPreview();
    const y = overlay.scrollTop;
    panelBack = opts.back ? opts.back.on : null;
    if (panelBack) acts = { ...acts, back: panelBack };
    overlay.innerHTML = (panelBack ? '<button type="button" class="backbtn" data-act="back">' + BACK_SVG + opts.back.label + '</button>' : '') +
      '<div class="panel' + (opts.wide ? ' wide' : '') + '">' + html + '</div>';
    overlay.classList.toggle('has-back', !!panelBack);
    overlay.classList.toggle('solid', !!opts.solid);
    overlay.hidden = false; overlay.scrollTop = opts.keepScroll ? y : 0;
    app.classList.add('menu');
    const els = overlay.querySelectorAll('[data-act]');
    [].forEach.call(els, el => el.addEventListener('click', () => acts[el.dataset.act](el)));
    const first = overlay.querySelector('[data-focus]') || overlay.querySelector('.panel [data-act]');
    try { if (first) first.focus({ preventScroll: true }); } catch (e) {}
  }

  function showStart() {
    showPanel(
      head('Times tables', 'Factor Flight') +
      '<p class="lede">Fly through the stars, planets and comets and catch the numbers that fit the top.</p>' +
      '<p class="hint">Steer with the bar at the bottom, the arrow buttons, or the arrow keys. Pick your name to see your progress, then start a mission or a speedrun.</p>' +
      '<p class="who">Who is flying?</p><div class="actions">' + PLAYERS.map(n => btn(n, 'pick', '', ' data-name="' + n + '"')).join('') + '</div>',
      { pick: el => showProfile(el.dataset.name) }
    );
  }

  function showProfile(name, keepScroll) {
    player = name;
    shipStyle = styleFor(rec(name));
    const r = rec(name), lo = CFG.MIN, hi = CFG.MAX;
    const next = planMission(name);

    // Mission summary: the facts this mission will focus on, colored by how well they are known.
    const count = lv => next.filter(f => f.lv === lv).length;
    const summary = [[count('bad'), 'to practice'], [count('ok'), 'still learning'], [count(''), 'new'], [count('good'), 'review']]
      .filter(x => x[0]).map(x => x[0] + ' ' + x[1]);
    const chips = '<div class="chips">' + next.map(f => '<span class="chip ' + f.lv + '">' + factLabel(f) + '</span>').join('') + '</div>';

    // Speedrun picker, one button per times table, with the best time for each.
    let runs = '<div class="runs">';
    for (let n = lo; n <= hi; n++) {
      const best = r.speed[n];
      runs += '<button class="run" type="button" data-act="speed" data-n="' + n + '" aria-label="Speedrun the ' + n + ' times table">' + n +
        '<small>' + (best ? fmt(best) : '-') + '</small></button>';
    }
    runs += '</div>';

    // Progress grid.
    let grid = '<div class="grid" role="img" aria-label="Times table progress for ' + name + '" style="grid-template-columns: repeat(' + (hi - lo + 2) + ', 1fr)">';
    grid += '<span class="h">×</span>';
    for (let b = lo; b <= hi; b++) grid += '<span class="h">' + b + '</span>';
    let known = 0, facts = 0, right = 0, tries = 0;
    for (let a = lo; a <= hi; a++) {
      grid += '<span class="h">' + a + '</span>';
      for (let b = lo; b <= hi; b++) {
        const e = r.facts[factKey(a, b)], lv = factLevel(e);
        if (a <= b) {
          facts++; if (lv === 'good') known++;
          if (e) { tries += e.h.length; right += e.h.split('').filter(c => c === '1').length; }
        }
        const tip = a + ' × ' + b + ' = ' + a * b + (e ? ': ' + Math.round(pct(e) * 100) + '% of the last ' + e.h.length : ': not seen yet');
        grid += '<span class="' + lv + '" title="' + tip + '">' + a * b + '</span>';
      }
    }
    grid += '</div>';
    grid += '<div class="legend"><span><i class="good"></i>Knows it</span><span><i class="ok"></i>Learning</span><span><i class="bad"></i>Needs practice</span><span><i></i>Not seen yet</span></div>';

    showPanel(
      '<div class="cols"><div class="col">' +
        head('Pilot', name) +
        '<div class="walletrow"><p class="wallet" aria-label="' + r.coins + ' coins"><span class="coin"></span>' + r.coins +
          '<button class="info" type="button" data-act="coinhelp" aria-expanded="false" aria-controls="coinhelp" aria-label="How to earn coins" title="How to earn coins">i</button></p>' +
          // A red dot when daily pay is waiting or something in the Hangar is affordable.
          btn('Rewards' + (rewardsNews(r) ? '<span class="dot" aria-label="something new"></span>' : ''), 'rewards', 'ghost small has-dot') + '</div>' +
        '<p class="hint coinhelp" id="coinhelp" hidden>' + COINS.tricky + ' coins for each tricky fact, ' + COINS.known + ' for a known one, ' + COINS.firstTry + ' more on the first try, and ' +
          COINS.mastered + ' when a fact turns green. Bonus coins for finishing, shields left, perfect runs and new best times. Flying at Fast speed adds ' +
          Math.round(COINS.fastBonus * 100) + '% more. Come back every day for daily pay in Rewards.</p>' +
        btn('Start mission', 'mission', 'big', ' data-focus') +
        '<div class="pace" role="group" aria-label="Speed">' + Object.keys(PACES).map(k =>
          '<button type="button" data-act="pace" data-pace="' + k + '" aria-pressed="' + (r.pace === k) + '">' + PACES[k].label + '</button>').join('') + '</div>' +
        '<p class="hint">Speed for missions and speedruns. Fast earns ' + Math.round(COINS.fastBonus * 100) + '% bonus coins.</p>' +
        '<p class="sec">This mission</p>' + chips +
        '<p class="hint">Focus: ' + summary.join(', ') + '.</p>' +
        '<p class="sec">Speedrun one times table</p>' + runs +
        '<p class="hint">Every question uses your number. Steer into the lane with the answer.</p>' +
      '</div><div class="col">' +
        statsHtml([['Known', known + '/' + facts], ['Score', tries ? Math.round(right / tries * 100) + '%' : '-'],
          ['Missions', r.games], ['Best mission', r.best ? fmt(r.best) : '-']]) +
        '<p class="sec">Times tables</p>' + grid +
        '<p class="hint">Colors come from the last ' + CFG.HISTORY + ' answers for each fact.</p>' +
      '</div></div>' +
      '',
      {
        mission: () => startMission(next),
        speed: el => startSpeed(+el.dataset.n),
        rewards: () => showRewards(name),
        pace: el => {
          r.pace = el.dataset.pace; saveDb();
          [].forEach.call(overlay.querySelectorAll('[data-act=pace]'), b => b.setAttribute('aria-pressed', String(b === el)));
        },
        coinhelp: el => {
          const open = el.getAttribute('aria-expanded') !== 'true';
          el.setAttribute('aria-expanded', String(open));
          $('coinhelp').hidden = !open;
        }
      },
      { wide: true, solid: true, keepScroll, back: { label: 'Players', on: showStart } }
    );
  }

  // ---------- daily pay ----------
  // Collected once a day on the progress page; a new day starts at 3am Eastern. Days 1 to 3 of each week
  // pay 10 coins, days 4 to 6 pay 25, and day 7 pays 100 times the week number (100, 200, 300...).
  // Missed days are covered by pauses: the first pause each streak week is free, a second costs
  // DAILY.pauseCost coins. Missing 3 days in a row, or needing a third pause in a week, ends the streak.
  const DAILY = { zone: 'America/New_York', resetHour: 3, pauseCost: 100, maxGap: 2, pausesPerWeek: 2 };
  function etParts(t) {
    const o = {};
    new Intl.DateTimeFormat('en-US', { timeZone: DAILY.zone, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' })
      .formatToParts(new Date(t)).forEach(p => { if (p.type !== 'literal') o[p.type] = +p.value; });
    return o;
  }
  // A day number that ticks over at 3am Eastern (daylight saving included).
  function payDay() {
    const p = etParts(Date.now() - DAILY.resetHour * 3600000);
    return Math.round(Date.UTC(p.year, p.month - 1, p.day) / 86400000);
  }
  function minutesToNextPay() {
    const p = etParts(Date.now());
    return (DAILY.resetHour * 60 - (p.hour * 60 + p.minute) + 1440) % 1440 || 1440;
  }
  const dailyAmount = streak => {
    const pos = (streak - 1) % 7 + 1;
    return pos <= 3 ? 10 : pos <= 6 ? 25 : 100 * Math.ceil(streak / 7);
  };
  // Today's streak day and what is needed before it can be collected:
  // claimed (already paid today), freePause (a missed day covered for free), choice (a paid pause is
  // needed: keep the streak for coins or start over) or broken (back to day 1).
  // keep is the record that covers the missed days, as if the last pay was yesterday.
  function dailyState(r) {
    const today = payDay(), d = r.daily;
    if (d.day === today) return { streak: d.streak, claimed: true };
    const gap = d.day && d.streak ? today - d.day - 1 : -1;
    if (gap === 0) return { streak: d.streak + 1 };
    if (gap < 0) return { streak: 1 };
    const next = d.streak + 1, week = Math.ceil(next / 7);
    const used = d.pweek === week ? d.pauses || 0 : 0;
    if (gap > DAILY.maxGap || used + gap > DAILY.pausesPerWeek) return { streak: 1, broken: true };
    const free = used === 0 ? 1 : 0, keep = { day: today - 1, streak: d.streak, pweek: week, pauses: used + gap };
    return gap > free ? { streak: next, choice: { gap, free }, keep } : { streak: next, freePause: true, keep };
  }
  function claimDaily(r) {
    const s = dailyState(r);
    if (s.claimed || s.choice) return 0;
    const d = s.keep || (s.broken ? {} : r.daily), amount = dailyAmount(s.streak);
    r.daily = { day: payDay(), streak: s.streak, pweek: d.pweek, pauses: d.pauses };
    r.coins += amount; r.coinsEarned += amount;
    saveDb();
    return amount;
  }
  // Paid pause: spend the coins and cover the missed days.
  function keepStreak(r) {
    const s = dailyState(r);
    if (!s.choice || !wallet.spend(player, DAILY.pauseCost)) return false;
    r.daily = s.keep; saveDb();
    return true;
  }
  const waitText = () => { const m = minutesToNextPay(); return (m >= 60 ? Math.floor(m / 60) + 'h ' : '') + (m % 60) + 'm'; };
  // Slim daily pay bar for the top of the Rewards page: the 7 days of this streak week, then
  // Collect (or the time to the next pay). Pause choices get one short line under it.
  function dailyBar(r) {
    const s = dailyState(r), pos = (s.streak - 1) % 7 + 1, before = s.streak - pos;
    let days = '';
    for (let i = 1; i <= 7; i++) {
      const cls = i < pos || (i === pos && s.claimed) ? 'done' : i === pos ? 'now' : '';
      days += '<li' + (cls ? ' class="' + cls + '"' : '') + ' title="Day ' + i + '">' + dailyAmount(before + i) + '</li>';
    }
    const missed = s.choice && (s.choice.gap === 1 ? 'a day' : '2 days');
    const note = s.freePause ? 'You missed a day, so your free pause kept your streak going.'
      : s.choice ? 'You missed ' + missed + (s.choice.free ? '. Your free pause covers one' : ' and this week\'s free pause is used') +
        '. Keep your streak for ' + DAILY.pauseCost + ' coins?'
      : s.broken ? 'Your streak ended, so this is day 1 again.' : '';
    const action = s.claimed ? '<span class="dwait" id="nextpay" data-day="' + payDay() + '" title="Next daily pay">' + waitText() + '</span>'
      : s.choice ? '' : '<button type="button" class="dcollect" data-act="daily">Collect +' + dailyAmount(s.streak) + '</button>';
    return '<div class="dbar" title="Daily pay. Miss a day? You get 1 free pause a week, and a 2nd for ' + DAILY.pauseCost + ' coins. Missing 3 days in a row ends the streak.">' +
      '<span class="dlabel">Daily · day ' + s.streak + '</span><ol class="dsegs" aria-label="Daily pay this week">' + days + '</ol>' + action + '</div>' +
      (note ? '<p class="dnote">' + note + (s.choice ? ' <button type="button" class="dcollect" data-act="keepstreak"' + (r.coins >= DAILY.pauseCost ? '' : ' disabled') +
        '>Keep streak · ' + DAILY.pauseCost + '</button><button type="button" class="dcollect ghost" data-act="startover">Start over</button>' : '') + '</p>' : '');
  }
  // Keep the countdown fresh, and show the new pay when 3am Eastern passes on an open Rewards page.
  setInterval(() => {
    const el = $('nextpay');
    if (!el || overlay.hidden) return;
    if (+el.dataset.day !== payDay()) showRewards(player, rewardsTab, true);
    else el.textContent = waitText();
  }, 30000);

  // ---------- hangar ----------
  // Spend coins on ship upgrades (with paint from level 3), songs and power-ups.
  const NOTE_SVG = '<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="6.5" cy="18" r="2.8" fill="currentColor"/><circle cx="17.5" cy="16" r="2.8" fill="currentColor"/></svg>';
  let previewing = null;
  function stopPreview() {
    if (!previewing) return;
    previewing = null; music.stop(0.3);
  }
  // Anything in the Hangar this player can afford right now (for the red dot).
  function canBuy(r) {
    const next = SHIPS[shipFor(r).level];
    return (next && r.coins >= next.price) || SONGS.some(sg => sg.price && !r.owned[sg.id] && r.coins >= sg.price) ||
      POWERS.some(pw => !r.owned[pw.id] && r.coins >= pw.price);
  }
  function hangarBuy(r, el) {
    const kind = el.dataset.kind, id = el.dataset.id, next = SHIPS[shipFor(r).level];
    const price = kind === 'ship' ? next && next.price : kind === 'song' ? songById(id).price : POWERS.find(x => x.id === id).price;
    if (!price || !wallet.spend(player, price)) return false;
    if (kind === 'ship') r.shipLevel = next.level;
    else { r.owned[id] = true; if (kind === 'song') r.song = id; }
    saveDb();
    return true;
  }
  const rewardsNews = r => !dailyState(r).claimed || canBuy(r);
  function hangarHtml(r) {
    const cur = shipFor(r), next = SHIPS[cur.level], sty = styleFor(r);
    shipStyle = sty;
    const buyBtn = (label, price, data) => btn(label + ' · ' + price, 'buy', 'small', data + (r.coins >= price ? '' : ' disabled'));

    const ships = '<div class="shop">' + SHIPS.map(sh => {
      const have = sh.level <= cur.level, isNext = next && sh.level === next.level;
      const st = sh.level === cur.level ? sty : { ...sh, key: String(sh.level) };
      return '<div class="card' + (sh.level === cur.level ? ' current' : '') + (have || isNext ? '' : ' later') + '">' +
        '<img src="' + shipPic(st) + '" alt="">' +
        '<b>Level ' + sh.level + ' · ' + sh.name + '</b><small>' + sh.perk + '</small>' +
        (sh.level === cur.level ? '<span class="badge">Flying</span>' : have ? '<span class="tag">Done</span>'
          : isNext ? buyBtn('Upgrade', sh.price, ' data-kind="ship"') : '<span class="tag">Level ' + (sh.level - 1) + ' first</span>') +
        '</div>';
    }).join('') + '</div>';
    const paints = !cur.paint ? '' : '<p class="sec">Paint your ship</p><div class="paints">' + [''].concat(Object.keys(PAINTS)).map(k => {
      const label = k ? k[0].toUpperCase() + k.slice(1) : 'Original';
      return '<button type="button" class="swatch" data-act="paint" data-color="' + k + '" aria-pressed="' + (r.shipColor === k) + '" aria-label="' + label + ' paint" title="' + label + '"' +
        ' style="--a: ' + (k ? PAINTS[k][0] : cur.top) + '; --b: ' + (k ? PAINTS[k][1] : cur.bottom) + '"></button>';
    }).join('') + '</div>';

    const songs = '<div class="shop">' + SONGS.map(sg => {
      const have = !sg.price || r.owned[sg.id], on = r.song === sg.id;
      return '<div class="card' + (on ? ' current' : '') + '"><span class="art">' + NOTE_SVG + '</span><b>' + sg.name + '</b><small>' + sg.about + '</small>' +
        '<div class="row">' + btn('Listen', 'listen', 'ghost small', ' data-id="' + sg.id + '"') +
        (on ? '<span class="badge">Playing</span>' : have ? btn('Use', 'use', 'small', ' data-id="' + sg.id + '"')
          : buyBtn('Buy', sg.price, ' data-kind="song" data-id="' + sg.id + '"')) + '</div></div>';
    }).join('') + '</div>';

    const powers = '<div class="shop">' + POWERS.map(pw =>
      '<div class="card"><span class="art" data-power="' + pw.id + '">' + powerSvg(pw.id, 32) + '</span><b>' + pw.name + '</b>' +
      '<small>' + pw.about + ' Key ' + pw.key + '.</small>' +
      (r.owned[pw.id] ? '<span class="badge">Owned</span>' : buyBtn('Buy', pw.price, ' data-kind="power" data-id="' + pw.id + '"')) + '</div>'
    ).join('') + '</div>';

    return '<p class="sec">Ship</p>' + ships + paints +
      '<p class="sec">Songs</p>' + songs +
      '<p class="sec">Power-ups</p>' + powers +
      '<p class="hint">Each power-up you own can be used once per game.</p>';
  }

  function startMission(facts) {
    mode = 'mission';
    plan = shuffle((facts || planMission(player)).slice());
    total = plan.length;
    rec(player).games++; saveDb();
    startGame();
  }

  function startSpeed(n) {
    mode = 'speed'; speedN = n;
    queue = [];
    for (let k = CFG.MIN; k <= CFG.MAX; k++) queue.push(k);
    shuffle(queue); missed.clear();
    total = queue.length;
    startGame();
  }

  function startGame() {
    ensureAudio();
    overlay.hidden = true; overlay.innerHTML = '';
    app.classList.remove('menu');
    $('pilot').textContent = player + (mode === 'speed' ? ' · ×' + speedN : '');
    pace = rec(player).pace;
    const pr = rec(player);
    shipStyle = styleFor(pr); maxShields = shipFor(pr).shields;
    useSong(pr.song); setupPowers();
    done = 0; shields = maxShields; wrongCount = 0;
    earned = {}; startLevels = {}; masteredNow.clear(); $('coins').textContent = '0';
    parts = []; kinds = []; ship.target = mode === 'speed' ? laneX(1) : 0;
    setupHud();
    newRound();
    startTime = performance.now(); pausedMs = 0;
    state = 'playing';
    music.setFactor(1);
    music.start();
  }

  function win() {
    state = 'won';
    const elapsed = gameSeconds();
    const r = rec(player);
    sfx.win(); music.stop(1.2);
    if (mode === 'speed') {
      const best = r.speed[speedN], isBest = !(best > 0) || elapsed < best;
      if (isBest) r.speed[speedN] = elapsed;
      award('speedrun');
      if (!wrongCount) award('perfect');
      if (isBest) award('best');
      saveDb();
      showPanel(
        head('Speedrun · ' + speedN + ' times table', fmt(elapsed)) +
        '<p class="lede">All ' + total + ' facts in the ' + speedN + ' times table, ' + player + '!</p>' +
        statsHtml([['Right first try', (total - missed.size) + '/' + total], ['Misses', wrongCount]]) +
        '<p class="hint">' + (isBest ? 'New best time for the ' + speedN + ' times table.' : 'Best time for the ' + speedN + ' times table is ' + fmt(best) + '.') + '</p>' +
        bankCoins() +
        '<div class="actions">' + btn('Run again', 'again') + rewardBtn() + btn('Progress', 'progress', 'ghost') + '</div>',
        { again: () => startSpeed(speedN), progress: () => showProfile(player), rewards: () => showRewards(player) }
      );
      return;
    }
    const isBest = !(r.best > 0) || elapsed < r.best;
    r.wins++;
    if (isBest) r.best = elapsed;
    award('mission'); award('shield', shields);
    if (isBest) award('best');
    saveDb();
    showPanel(
      head('Mission complete', 'Nice flying, ' + player + '!') +
      '<p class="lede">All ' + total + ' facts done.</p>' +
      statsHtml([['Time', fmt(elapsed)], ['Shields left', shields + '/' + maxShields], ['Wrong catches', wrongCount]]) +
      '<p class="hint">' + (isBest ? 'New best mission time.' : 'Best mission time is ' + fmt(r.best) + '.') + '</p>' +
      bankCoins() +
      '<div class="actions">' + btn('Next mission', 'again') + rewardBtn() + btn('Progress', 'progress', 'ghost') + '</div>',
      { again: () => startMission(), progress: () => showProfile(player), rewards: () => showRewards(player) }
    );
  }

  function lose() {
    state = 'lost'; music.stop(0.5); sfx.lose();
    showPanel(
      head('Shields down', 'Try again, ' + player) +
      '<p class="lede">You got ' + done + ' of ' + total + ' facts.</p>' +
      statsHtml([['Facts', done + '/' + total], ['Wrong catches', wrongCount]]) +
      bankCoins() +
      '<div class="actions">' + btn('Try again', 'again') + rewardBtn() + btn('Progress', 'progress', 'ghost') + '</div>',
      { again: () => startMission(), progress: () => showProfile(player), rewards: () => showRewards(player) }
    );
  }

  // ---------- power-ups ----------
  // Bought once in the Hangar, then each can be used once per game: buttons on the left, or keys 1, 2 and 3.
  const POWERS = [
    { id: 'boost', name: 'Boost', price: 200, key: '1', about: 'Fly at double speed for 6 seconds. Great for best times.' },
    { id: 'zap', name: 'Zap', price: 250, key: '2', about: 'Blast away a wrong answer that is coming at you.' },
    { id: 'freeze', name: 'Freeze', price: 300, key: '3', about: 'Stop everything, even the timer, for 3 seconds.' }
  ];
  const POWER_KEYS = { 1: 'boost', 2: 'zap', 3: 'freeze' };
  const BOOST_SECS = 6, FREEZE_SECS = 3;
  const POWER_ICONS = {
    boost: '<path d="M6 13l6-6 6 6M6 19l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>',
    zap: '<path d="M13 2 4 14h7l-1 8 9-12h-7z" fill="currentColor"/>',
    freeze: '<path d="M12 2v20M3.3 7l17.4 10M20.7 7 3.3 17M9 3.6l3 2.4 3-2.4M9 20.4l3-2.4 3 2.4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'
  };
  const powerSvg = (id, size) => '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" aria-hidden="true">' + POWER_ICONS[id] + '</svg>';
  const power = { boostT: 0, freezeT: 0, used: {} };
  function setupPowers() {
    power.boostT = power.freezeT = 0; power.used = {};
    const r = rec(player);
    $('powers').innerHTML = POWERS.filter(p => r.owned[p.id]).map(p =>
      '<button type="button" class="power" data-power="' + p.id + '" aria-label="' + p.name + ' (key ' + p.key + ')" title="' + p.name + ' (key ' + p.key + ')">' +
      powerSvg(p.id, 22) + '<i>' + p.key + '</i></button>').join('');
  }
  const powerBtn = id => $('powers').querySelector('[data-power="' + id + '"]');
  function powerOff(id) { const b = powerBtn(id); if (b) b.classList.remove('on'); }
  $('powers').addEventListener('click', e => { const b = e.target.closest('[data-power]'); if (b) usePower(b.dataset.power); });
  // Whether catching this number is right (in a factors round, any number that still fits).
  const wanted = o => round.kind !== 'factors' ? o.val === round.answer
    : round.picked === null ? round.valid.indexOf(o.val) >= 0 : o.val === round.need;
  function usePower(id) {
    if (!inGame() || paused || power.used[id] || !rec(player).owned[id]) return;
    if (id === 'zap') {
      // The wrong number closest to the ship, or in a speedrun one wrong lane of the coming row.
      let target = null;
      if (mode === 'speed') {
        const w = objs.find(o => o.wave && !o.wave.checked);
        if (w) target = pick(w.wave.objs.filter(o => !o.zapped && o.val !== round.answer)) || null;
      } else {
        for (const o of objs) if (!o.checked && !o.dead && o.u > 0.05 && o.u < 0.93 && !wanted(o) && (!target || o.u > target.u)) target = o;
      }
      if (!target) return; // nothing wrong on screen yet, so the Zap is kept
      const p = project(target.wx, target.u);
      burst(p.x, p.y, COL.pink, 26); floater(p.x, p.y, 'ZAP!', COL.pink);
      if (target.wave) target.zapped = true; else target.dead = true;
      tone(880, 0.25, 'sawtooth', 0.08, 0, 220);
    } else if (id === 'boost') {
      power.boostT = BOOST_SECS;
      floater(W / 2, shipY - objR * 3, 'BOOST!', COL.gold);
      tone(300, 0.4, 'triangle', 0.1, 0, 900);
    } else {
      power.freezeT = FREEZE_SECS;
      floater(W / 2, shipY - objR * 3, 'FREEZE!', COL.ice);
      tone(1200, 0.5, 'sine', 0.08, 0, 600);
    }
    power.used[id] = true;
    const b = powerBtn(id);
    if (b) { b.disabled = true; if (id !== 'zap') b.classList.add('on'); }
  }

  // ---------- quit ----------
  // The red X pauses the game and asks first. Quitting keeps the coins earned so far.
  const inGame = () => state === 'playing' || state === 'interlude';
  function askQuit() {
    if (!inGame() || paused) return;
    paused = true; pauseAt = performance.now();
    keys.left = keys.right = false; drag = null;
    music.stop(0.2);
    $('confirm').hidden = false;
    try { $('keepFlying').focus({ preventScroll: true }); } catch (e) {}
  }
  function resumeGame() {
    if (!paused) return;
    pausedMs += performance.now() - pauseAt; paused = false;
    $('confirm').hidden = true;
    music.start();
  }
  function quitGame() {
    resumeGame(); music.stop(0.2);
    state = 'ready'; objs = [];
    bankCoins();
    showProfile(player);
  }
  $('quit').addEventListener('click', askQuit);
  $('keepFlying').addEventListener('click', resumeGame);
  $('quitYes').addEventListener('click', quitGame);

  // ---------- input ----------
  // In a speedrun the ship snaps to lanes: keys and arrow buttons move one lane per press.
  const snap = () => { if (mode === 'speed') ship.target = laneX(nearestLane(ship.target)); };
  let drag = null;
  const keys = { left: false, right: false };
  app.addEventListener('pointerdown', e => {
    if (!inGame() || paused) return;
    if (e.target.closest('button') || e.target.closest('#controls')) return;
    drag = { x: e.clientX, t: ship.target };
    try { app.setPointerCapture(e.pointerId); } catch (err) {}
  });
  app.addEventListener('pointermove', e => {
    if (!drag) return;
    ship.target = clamp(drag.t + ((e.clientX - drag.x) / halfW) * 1.35, -LIM, LIM);
    snap();
  });
  const endDrag = () => { drag = null; };
  app.addEventListener('pointerup', endDrag);
  app.addEventListener('pointercancel', endDrag);
  const keyDir = e => (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') ? -1 : (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') ? 1 : 0;
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && closeViewer()) return;
    if (e.key === 'Escape' && panelBack && !overlay.hidden && !inGame()) { panelBack(); return; }
    if (e.key === 'Escape' && inGame()) { if (paused) resumeGame(); else askQuit(); return; }
    if (paused) return;
    if (POWER_KEYS[e.key]) { usePower(POWER_KEYS[e.key]); return; }
    const d = keyDir(e);
    if (!d) return;
    e.preventDefault();
    if (mode === 'speed') { if (!e.repeat && (state === 'playing' || state === 'interlude')) stepLane(d); return; }
    keys[d < 0 ? 'left' : 'right'] = true;
  });
  window.addEventListener('keyup', e => {
    const d = keyDir(e);
    if (d) keys[d < 0 ? 'left' : 'right'] = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = false; drag = null; });

  // ---------- steering bar ----------
  const track = $('track'), thumb = $('thumb');
  const THUMB_W = 72;
  let lastOff = -1, tdrag = false;
  function setFromTrack(clientX) {
    const r = track.getBoundingClientRect(), inner = track.clientWidth - THUMB_W;
    if (inner <= 0) return;
    const frac = clamp((clientX - r.left - track.clientLeft - THUMB_W / 2) / inner, 0, 1);
    ship.target = lerp(-LIM, LIM, frac);
    snap();
  }
  track.addEventListener('pointerdown', e => {
    tdrag = true;
    try { track.setPointerCapture(e.pointerId); } catch (err) {}
    setFromTrack(e.clientX); e.preventDefault();
  });
  track.addEventListener('pointermove', e => { if (tdrag) setFromTrack(e.clientX); });
  const endTrack = () => { tdrag = false; };
  track.addEventListener('pointerup', endTrack);
  track.addEventListener('pointercancel', endTrack);
  function renderThumb() {
    const inner = Math.max(0, track.clientWidth - THUMB_W);
    const off = Math.round(((ship.target + LIM) / (2 * LIM)) * inner);
    if (off !== lastOff) { lastOff = off; thumb.style.transform = 'translateX(' + off + 'px)'; }
  }
  [['btnL', 'left'], ['btnR', 'right']].forEach(([id, side]) => {
    const b = $(id);
    const down = e => {
      if (paused) return;
      if (mode === 'speed') stepLane(side === 'left' ? -1 : 1); else keys[side] = true;
      b.classList.add('held');
      try { b.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    };
    const up = () => { keys[side] = false; b.classList.remove('held'); };
    b.addEventListener('pointerdown', down);
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('lostpointercapture', up);
  });

  // ---------- starfield ----------
  function makeStar(init) {
    return { a: Math.random() * Math.PI * 2, r: init ? Math.random() : Math.random() * 0.03, v: rnd(0.6, 1.4), s: rnd(0.5, 1.5), col: pick(STAR_TINTS), dr: 0 };
  }
  for (let i = 0; i < 150; i++) stars.push(makeStar(true));

  // ---------- update ----------
  function update(dt) {
    tAnim += dt;
    const playing = state === 'playing', live = playing || state === 'interlude';

    const speed = mode === 'speed';
    // Power-ups: Freeze stops the world and the game timer, Boost runs the world at double speed.
    const frozen = live && power.freezeT > 0, boosted = live && power.boostT > 0;
    if (frozen) { power.freezeT -= dt; pausedMs += dt * 1000; if (power.freezeT <= 0) powerOff('freeze'); }
    if (boosted) { power.boostT -= dt; if (power.boostT <= 0) powerOff('boost'); }
    const wdt = frozen ? 0 : boosted ? dt * 2 : dt;
    const wTarget = frozen ? 0.05 : state === 'interlude' ? 2.6 : live ? (speed ? 1.7 : 1) * (boosted ? 2 : 1) : 0.6;
    warp += (wTarget - warp) * Math.min(1, dt * 4);
    const w = warp * (reduce ? 0.5 : 1);
    for (const s of stars) {
      const dr = dt * w * (0.1 + s.r * 1.5) * s.v;
      s.r += dr; s.dr = dr;
      if (s.r > 1) Object.assign(s, makeStar(false));
    }

    if (!live) ship.target = Math.sin(tAnim * 0.7) * 0.55;
    if (live) music.setFactor((speed ? 1.1 : 1) + 0.025 * Math.min(done, CFG.ROUNDS) + (boosted ? 0.12 : 0));
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir && live && !speed) ship.target = clamp(ship.target + dir * 2.0 * dt, -LIM, LIM);
    const prev = ship.wx;
    ship.wx += (ship.target - ship.wx) * Math.min(1, dt * 12);
    ship.bank += (clamp((ship.wx - prev) / Math.max(dt, 0.001) * 0.18, -0.4, 0.4) - ship.bank) * Math.min(1, dt * 10);
    ship.pulse = Math.max(0, ship.pulse - dt * 2.2);

    worldAlpha += ((state === 'interlude' ? 0 : 1) - worldAlpha) * Math.min(1, dt * 7);

    if (speed) {
      // One row of answers per question.
      if (playing && !round.spawned) { spawnT -= wdt; if (spawnT <= 0) { spawnWave(); round.spawned = true; } }
    } else if (state !== 'interlude') {
      spawnT -= wdt;
      if (spawnT <= 0) { spawn(); spawnT = spawnEvery(); }
    }

    const du = wdt / travelTime();
    // Generous catch zone: wide (at least a sixth of the field on big screens) and open for a short
    // stretch around the ship, so a ship that is still moving or wiggling with the arrows still catches.
    const hitDist = Math.max(objR * 2.4, halfW * 0.17);
    for (const o of objs) {
      o.u += du;
      if (playing && !o.checked && o.u >= 1 && o.wave) resolveWave(o.wave);
      else if (playing && !o.checked && !o.wave && o.u >= 0.93) {
        const dx = Math.abs(o.wx - ship.wx) * halfW;
        // Enhanced sensors (ship level 4) reach further for right answers and less for wrong ones.
        const reach = !shipStyle.sensors ? hitDist : wanted(o) ? hitDist * SENSOR.right : hitDist * SENSOR.wrong;
        if (dx < reach) { o.checked = true; o.dead = true; onCapture(o, vpX + o.wx * halfW, shipY); }
        else if (o.u >= 1.1) o.checked = true;
      }
      if (!o.dead && project(o.wx, o.u).y > H + objR * 3) o.dead = true;
    }
    objs = objs.filter(o => !o.dead);

    if (state === 'interlude') {
      interludeT -= dt;
      if (interludeT <= 0) {
        if (done >= total) win(); else { state = 'playing'; newRound(); }
      }
    }

    for (const p of parts) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= p.text ? 1 : 0.96; p.life -= dt;
    }
    parts = parts.filter(p => p.life > 0);
  }

  // ---------- draw ----------
  function starPath(x, y, ro, ri, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot + i * Math.PI / 5 - Math.PI / 2, r = i % 2 ? ri : ro;
      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath();
  }
  function drawNumber(v, x, y, r, fill, stroke) {
    const len = String(v).length;
    ctx.font = '700 ' + Math.max(10, r * (len >= 3 ? 0.68 : len === 2 ? 0.86 : 1.05)) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (stroke) { ctx.lineWidth = Math.max(2, r * 0.22); ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.strokeText(v, x, y + r * 0.05); }
    ctx.fillStyle = fill; ctx.fillText(v, x, y + r * 0.05);
  }

  function drawObj(o) {
    if (o.zapped) return;
    const p = project(o.wx, o.u), r = objR * p.k, x = p.x, y = p.y;
    const alpha = worldAlpha * Math.min(1, o.u / 0.12);
    if (alpha < 0.01) return;
    ctx.globalAlpha = alpha;
    let g = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 2.2);
    g.addColorStop(0, rgba(o.col, 0.34)); g.addColorStop(1, rgba(o.col, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.2, 0, Math.PI * 2); ctx.fill();

    if (o.type === 'star') {
      const rot = Math.sin(tAnim * o.spin) * 0.18;
      starPath(x, y, r * 1.2, r * 0.64, rot);
      g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r * 1.3);
      g.addColorStop(0, COL.goldLight); g.addColorStop(1, COL.gold);
      ctx.fillStyle = g; ctx.strokeStyle = COL.gold; ctx.lineJoin = 'round'; ctx.lineWidth = r * 0.22;
      ctx.fill(); ctx.stroke();
      drawNumber(o.val, x, y + r * 0.04, r * 0.95, COL.onGold);
    } else if (o.type === 'planet') {
      const ringR = r * 1.6;
      if (o.ring) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(o.tilt); ctx.scale(1, 0.28);
        ctx.beginPath(); ctx.arc(0, 0, ringR, Math.PI, Math.PI * 2);
        ctx.lineWidth = r * 0.3; ctx.strokeStyle = rgba(COL.ink, 0.5); ctx.stroke(); ctx.restore();
      }
      ctx.save();
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = o.col; ctx.fillRect(x - r, y - r, r * 2, r * 2);
      g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.05, x - r * 0.2, y - r * 0.2, r * 1.1);
      g.addColorStop(0, rgba('#ffffff', 0.5)); g.addColorStop(1, rgba('#ffffff', 0));
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
      g = ctx.createRadialGradient(x + r * 0.3, y + r * 0.3, r * 0.2, x + r * 0.3, y + r * 0.3, r * 1.4);
      g.addColorStop(0, rgba(COL.space0, 0)); g.addColorStop(1, rgba(COL.space0, 0.6));
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.restore();
      if (o.ring) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(o.tilt); ctx.scale(1, 0.28);
        ctx.beginPath(); ctx.arc(0, 0, ringR, 0, Math.PI);
        ctx.lineWidth = r * 0.3; ctx.strokeStyle = rgba(COL.ink, 0.75); ctx.stroke(); ctx.restore();
      }
      drawNumber(o.val, x, y, r * 0.95, '#ffffff', COL.space0);
    } else {
      let dx = vpX - x, dy = vpY - y; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
      const L = r * 3.4, ex = x + dx * L, ey = y + dy * L, px = -dy * r * 0.85, py = dx * r * 0.85;
      g = ctx.createLinearGradient(x, y, ex, ey);
      g.addColorStop(0, rgba(COL.ice, 0.85)); g.addColorStop(1, rgba(COL.ice, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x + px, y + py); ctx.lineTo(ex, ey); ctx.lineTo(x - px, y - py); ctx.closePath(); ctx.fill();
      g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.05, x, y, r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(1, COL.ice);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 0.95, 0, Math.PI * 2); ctx.fill();
      drawNumber(o.val, x, y, r * 0.9, COL.space0);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- ships ----------
  // The ship is upgraded in levels in the Hangar. Each level is a new look plus a perk:
  // level 2 adds a 4th shield, level 3 a 5th shield and paint colors, level 4 enhanced sensors.
  // Each look is a half outline (pts, mirrored for the other side) from nose to tail, plus colors.
  // These looks are placeholders until Ken's designs are ready.
  const SHIPS = [
    { level: 1, name: 'Star Dart', price: 0, shields: 3, perk: 'Your first ship. 3 shields.', nose: -1.25, tail: 0.62,
      pts: [[0.32, -0.4], [1.2, 0.5], [1.12, 0.78], [0.42, 0.52], [0.2, 0.7]],
      top: '#f4f7ff', bottom: '#8c97dc', stripe: '#4653b4', wing: COL.coral, glass: COL.ice, flame: COL.ice },
    { level: 2, name: 'Comet Racer', price: 250, shields: 4, perk: 'A 4th shield.', nose: -1.5, tail: 0.66,
      pts: [[0.22, -0.6], [0.5, 0.1], [1.25, 0.85], [1.1, 0.95], [0.35, 0.62], [0.18, 0.78]],
      top: '#e2faff', bottom: '#3fa9d6', stripe: '#1d5f8a', wing: COL.gold, glass: '#ffffff', flame: COL.ice },
    { level: 3, name: 'Ruby Falcon', price: 500, shields: 5, paint: true, perk: 'A 5th shield, and you can paint your ship.', nose: -1.3, tail: 0.62,
      pts: [[0.3, -0.5], [0.55, -0.1], [1.15, -0.2], [1.0, 0.35], [0.45, 0.55], [0.22, 0.75]],
      top: '#ffd6de', bottom: '#d8344f', stripe: '#7a1830', wing: COL.gold, glass: COL.ice, flame: COL.orange },
    { level: 4, name: 'Gold Nova', price: 800, shields: 5, paint: true, sensors: true,
      perk: 'Enhanced sensors: right answers are easier to catch and wrong ones easier to dodge.', nose: -1.35, tail: 0.64,
      pts: [[0.3, -0.45], [0.75, 0.05], [1.35, 0.15], [1.05, 0.45], [1.25, 0.8], [0.5, 0.6], [0.22, 0.78]],
      top: '#fff3c4', bottom: '#e0a23a', stripe: '#8a5a10', wing: COL.pink, glass: COL.ice, flame: COL.gold }
  ];
  // Paint colors from level 3: [light top, darker bottom].
  const PAINTS = {
    ice: ['#e2faff', '#3fa9d6'], mint: ['#dcfff3', '#22b487'], coral: ['#ffd6de', '#d8344f'], violet: ['#ece4ff', '#7b5cf0'],
    gold: ['#fff3c4', '#e0a23a'], pink: ['#ffe2ef', '#ff5c93'], night: ['#c9d3f2', '#2d3570']
  };
  // Enhanced sensors: catch zone this much bigger for right answers and smaller for wrong ones.
  const SENSOR = { right: 1.18, wrong: 0.82 };
  const shipFor = r => SHIPS[clamp((r.shipLevel || 1) - 1, 0, SHIPS.length - 1)];
  function styleFor(r) {
    const base = shipFor(r), paint = base.paint && PAINTS[r.shipColor];
    return paint ? { ...base, top: paint[0], bottom: paint[1], key: base.level + r.shipColor } : { ...base, key: String(base.level) };
  }
  let shipStyle = { ...SHIPS[0], key: '1' };

  // Draws a ship centred on the origin of context g, s = size, fl = engine flicker.
  function paintShip(g, st, s, fl) {
    let gr = g.createRadialGradient(0, s * 0.55, 0, 0, s * 0.55, s * 1.9 * fl);
    gr.addColorStop(0, rgba(st.flame, 0.8)); gr.addColorStop(0.35, rgba(st.flame, 0.26)); gr.addColorStop(1, rgba(st.flame, 0));
    g.fillStyle = gr; g.beginPath(); g.arc(0, s * 0.55, s * 1.9 * fl, 0, Math.PI * 2); g.fill();

    const P = st.pts;
    g.beginPath(); g.moveTo(0, st.nose * s);
    P.forEach(p => g.lineTo(p[0] * s, p[1] * s));
    g.lineTo(0, st.tail * s);
    for (let i = P.length - 1; i >= 0; i--) g.lineTo(-P[i][0] * s, P[i][1] * s);
    g.closePath();
    gr = g.createLinearGradient(0, st.nose * s, 0, 0.8 * s);
    gr.addColorStop(0, st.top); gr.addColorStop(1, st.bottom);
    g.fillStyle = gr; g.fill();
    g.lineWidth = 1.5; g.strokeStyle = rgba(COL.space0, 0.6); g.stroke();

    g.fillStyle = st.stripe;
    g.beginPath(); g.moveTo(0, (st.nose + 0.25) * s); g.lineTo(0.2 * s, 0); g.lineTo(0.17 * s, 0.6 * s); g.lineTo(0, 0.55 * s);
    g.lineTo(-0.17 * s, 0.6 * s); g.lineTo(-0.2 * s, 0); g.closePath(); g.fill();

    // Wingtip accents on the outermost point of each wing.
    let ti = 0;
    P.forEach((p, i) => { if (p[0] > P[ti][0]) ti = i; });
    const a = P[ti], b = P[Math.min(ti + 1, P.length - 1)];
    g.fillStyle = st.wing;
    [1, -1].forEach(m => {
      g.beginPath(); g.moveTo(a[0] * s * m, a[1] * s); g.lineTo(b[0] * s * m, b[1] * s); g.lineTo((a[0] - 0.28) * s * m, (a[1] + b[1]) / 2 * s);
      g.closePath(); g.fill();
    });
    g.fillStyle = st.glass;
    g.beginPath(); g.ellipse(0, -0.2 * s, 0.13 * s, 0.26 * s, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = COL.goldLight;
    [1, -1].forEach(m => { g.beginPath(); g.arc(0.14 * s * m, (st.tail - 0.04) * s, 0.09 * s * fl, 0, Math.PI * 2); g.fill(); });
  }

  // Hangar pictures: each ship drawn once into a small canvas.
  const shipPics = {};
  function shipPic(st) {
    if (!shipPics[st.key]) {
      const c = document.createElement('canvas'); c.width = c.height = 240;
      const g = c.getContext('2d');
      g.translate(120, 108); paintShip(g, st, 60, 1);
      shipPics[st.key] = c.toDataURL();
    }
    return shipPics[st.key];
  }

  function drawShip() {
    const x = vpX + ship.wx * halfW, y = shipY, s = objR * 1.1;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ship.bank);
    const fl = 0.85 + 0.15 * Math.sin(tAnim * 38) + Math.random() * 0.06;
    paintShip(ctx, shipStyle, s, fl);
    if (ship.pulse > 0) {
      ctx.globalAlpha = ship.pulse; ctx.strokeStyle = ship.pulseCol; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, s * (1.5 + (1 - ship.pulse) * 1.6), 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  // Speedrun lane lines from the vanishing point, with the ship's lane lit up.
  function drawLanes() {
    const L = CFG.LANES, half = (laneX(1) - laneX(0)) / 2, cur = nearestLane(ship.target);
    const a = project(laneX(cur) - half, 0), b = project(laneX(cur) + half, 0);
    const c = project(laneX(cur) + half, 1.3), d = project(laneX(cur) - half, 1.3);
    ctx.globalAlpha = 0.08; ctx.fillStyle = COL.gold;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.22; ctx.strokeStyle = COL.ice; ctx.lineWidth = 1.5;
    for (let i = 0; i <= L; i++) {
      const wx = laneX(0) - half + i * half * 2, p0 = project(wx, 0), p1 = project(wx, 1.3);
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // The question rides on a gate just above its row of answers.
  function drawGate(o) {
    const p = project(0, o.u), r = objR * p.k;
    const alpha = worldAlpha * Math.min(1, o.u / 0.12);
    if (alpha < 0.01) return;
    const xl = project(laneX(0), o.u).x - r * 1.3, xr = project(laneX(CFG.LANES - 1), o.u).x + r * 1.3;
    const y = p.y - r * 2.4, hh = r * 1.6;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(xl, y - hh / 2, xr - xl, hh, hh / 2); else ctx.rect(xl, y - hh / 2, xr - xl, hh);
    ctx.fillStyle = rgba(COL.space0, 0.7); ctx.fill();
    ctx.lineWidth = Math.max(1, r * 0.08); ctx.strokeStyle = rgba(COL.gold, 0.7); ctx.stroke();
    ctx.font = '700 ' + Math.max(8, r * 1.05) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = COL.gold; ctx.fillText(o.wave.label, vpX, y + r * 0.05);
    ctx.globalAlpha = 1;
  }

  function draw() {
    ctx.globalAlpha = 1;
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = nebA; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = nebB; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);

    const R = Math.hypot(W, H) * 0.8;
    ctx.lineCap = 'round';
    for (const s of stars) {
      const ca = Math.cos(s.a), sa = Math.sin(s.a), r1 = s.r, r0 = Math.max(0, s.r - s.dr * 1.6);
      ctx.globalAlpha = Math.min(1, r1 * 5) * (0.3 + 0.7 * r1);
      ctx.strokeStyle = s.col; ctx.lineWidth = s.s * (0.5 + r1 * 2.2);
      ctx.beginPath(); ctx.moveTo(vpX + ca * r0 * R, vpY + sa * r0 * R); ctx.lineTo(vpX + ca * r1 * R, vpY + sa * r1 * R); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    if (mode === 'speed' && (state === 'playing' || state === 'interlude')) drawLanes();
    objs.sort((a, b) => a.u - b.u);
    for (const o of objs) drawObj(o);
    for (const o of objs) if (o.wave && o.lane === 0 && !o.wave.checked) drawGate(o);
    if (power.freezeT > 0 && inGame()) { ctx.fillStyle = rgba(COL.ice, 0.1); ctx.fillRect(0, 0, W, H); }
    drawShip();

    for (const p of parts) {
      const a = clamp(p.life / p.max, 0, 1);
      ctx.globalAlpha = a;
      if (p.text) {
        ctx.font = '700 ' + p.size + 'px ' + FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = COL.space0; ctx.strokeText(p.text, p.x, p.y);
        ctx.fillStyle = p.col; ctx.fillText(p.text, p.x, p.y);
      } else {
        ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ---------- music: song data ----------
  const STEPS = 32;        // 4 bars of 8 eighth notes
  const PAD_SLOT = 4;      // each pad chord lasts 4 steps
  const WAVES = [['triangle', 'Soft'], ['sine', 'Pure'], ['sawtooth', 'Bright'], ['square', 'Hollow']];
  const SCALES = {
    minor: { name: 'Minor', semis: [0, 2, 3, 5, 7, 8, 10] },
    major: { name: 'Major', semis: [0, 2, 4, 5, 7, 9, 11] },
    dorian: { name: 'Dorian', semis: [0, 2, 3, 5, 7, 9, 10] },
    pent: { name: 'Minor pentatonic', semis: [0, 3, 5, 7, 10] }
  };
  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const BASE = { bass: 40, lead: 64, pad: 52 };
  const LEVEL = { drums: 0.9, bass: 0.85, lead: 0.5, pad: 0.32 };
  const BASS_DEGS = [4, 3, 2, 1, 0, -1, -2];
  const LEAD_DEGS = [7, 6, 5, 4, 3, 2, 1, 0];
  const LAYER_IDS = ['drums', 'bass', 'lead', 'pad'];
  const mod = (a, n) => ((a % n) + n) % n;

  function defaultSong() {
    const pat = s => s.split('').map(c => c === 'x');
    const P = (...bars) => [].concat(...bars.map(pat));
    return {
      v: 1, bpm: 112, key: 9, scale: 'minor', master: 0.55,
      drums: {
        vol: 0.85, mute: false,
        kick: P('x...x...', 'x...x.x.', 'x...x...', 'x...x.x.'),
        snare: P('..x...x.', '..x...x.', '..x...x.', '..x..xxx'),
        hat: P('.x.x.x.x', '.x.x.x.x', '.x.x.x.x', '.x.x.x.x')
      },
      bass: {
        vol: 0.8, mute: false, wave: 'sawtooth',
        notes: [].concat([0, null, 0, 0, null, 0, null, -2], [-2, null, -2, -2, null, -2, null, 2],
          [2, null, 2, 2, null, 2, null, -1], [-1, null, -1, -1, null, -1, null, 0])
      },
      lead: {
        vol: 0.7, mute: false, wave: 'triangle',
        notes: [].concat([0, 2, 4, 2, 4, 7, 4, 2], [5, 2, 0, 2, 5, 7, 5, 2],
          [2, 4, 6, 4, 2, 4, 6, null], [6, 3, 1, 3, 6, 3, 1, null])
      },
      pad: { vol: 0.8, mute: false, wave: 'sawtooth', chords: [0, 0, 5, 5, 2, 2, 6, 6] }
    };
  }

  // More songs for the Hangar. Notes are scale degrees (0 = the key), null = rest; 32 steps = 4 bars of eighths.
  const beats = (...bars) => [].concat(...bars.map(b => b.split('').map(c => c === 'x')));
  const notes = (...bars) => [].concat(...bars);
  const _ = null;
  const SONGS = [
    { id: 'loop', name: 'Star Loop', price: 0, about: 'The original flight theme.', make: defaultSong },
    { id: 'groove', name: 'Moon Groove', price: 100, about: 'Slow and funky, in D.', make: () => ({
      v: 1, bpm: 100, key: 2, scale: 'dorian', master: 0.55,
      drums: { vol: 0.85, mute: false,
        kick: beats('x..x..x.', 'x..x....', 'x..x..x.', 'x..x.xx.'),
        snare: beats('....x...', '....x...', '....x...', '....x..x'),
        hat: beats('x.x.x.x.', 'x.x.x.x.', 'x.x.x.x.', 'x.x.xxx.') },
      bass: { vol: 0.85, mute: false, wave: 'triangle',
        notes: notes([0, _, _, 0, _, 4, 3, _], [3, _, _, 3, _, 2, 0, _], [-3, _, _, -3, _, -1, 0, _], [0, _, 4, _, 3, _, 2, _]) },
      lead: { vol: 0.55, mute: false, wave: 'square',
        notes: notes([4, _, 5, 4, 2, _, 0, _], [2, _, 3, 2, 0, _, -1, _], [-1, 0, 2, _, 4, _, 2, _], [5, 4, 2, 0, 2, _, _, _]) },
      pad: { vol: 0.9, mute: false, wave: 'triangle', chords: [0, 0, 3, 3, 5, 5, 4, 4] }
    }) },
    { id: 'chase', name: 'Comet Chase', price: 150, about: 'Fast and driving, in E.', make: () => ({
      v: 1, bpm: 128, key: 4, scale: 'pent', master: 0.5,
      drums: { vol: 0.85, mute: false,
        kick: beats('x.x.x.x.', 'x.x.x.x.', 'x.x.x.x.', 'x.x.x.xx'),
        snare: beats('..x...x.', '..x...x.', '..x...x.', '..x.x.xx'),
        hat: beats('xxxxxxxx', 'xxxxxxxx', 'xxxxxxxx', 'xxxxxxxx') },
      bass: { vol: 0.8, mute: false, wave: 'sawtooth',
        notes: notes([0, 0, _, 0, 2, _, 0, _], [0, 0, _, 0, 3, _, 2, _], [-1, -1, _, -1, 1, _, -1, _], [-2, -2, _, -2, 0, _, 1, 2]) },
      lead: { vol: 0.55, mute: false, wave: 'sawtooth',
        notes: notes([5, _, 7, 5, 4, _, 2, _], [4, 5, 4, 2, 0, _, 2, _], [5, _, 7, 8, 7, _, 5, _], [4, 2, 0, 2, 4, _, _, _]) },
      pad: { vol: 0.6, mute: false, wave: 'sawtooth', chords: [0, 0, 0, 0, 4, 4, 3, 3] }
    }) },
    { id: 'glow', name: 'Galaxy Glow', price: 200, about: 'Calm and dreamy, in C.', make: () => ({
      v: 1, bpm: 92, key: 0, scale: 'major', master: 0.55,
      drums: { vol: 0.6, mute: false,
        kick: beats('x.......', 'x.....x.', 'x.......', 'x.....x.'),
        snare: beats('....x...', '....x...', '....x...', '....x...'),
        hat: beats('..x...x.', '..x...x.', '..x...x.', '..x.x.x.') },
      bass: { vol: 0.85, mute: false, wave: 'triangle',
        notes: notes([0, _, _, _, 0, _, 4, _], [-2, _, _, _, -2, _, 2, _], [-4, _, _, _, -4, _, 0, _], [-3, _, _, _, -3, _, 1, _]) },
      lead: { vol: 0.7, mute: false, wave: 'triangle',
        notes: notes([4, _, 7, _, 6, 4, _, _], [2, _, 5, _, 4, 2, _, _], [0, _, 3, _, 2, 0, _, _], [1, _, 4, 6, 7, _, _, _]) },
      pad: { vol: 0.9, mute: false, wave: 'triangle', chords: [0, 0, 5, 5, 3, 3, 4, 4] }
    }) }
  ];
  const songById = id => SONGS.find(x => x.id === id) || SONGS[0];

  let song = defaultSong();
  function useSong(id) {
    song = songById(id).make();
    music.sync();
  }

  const semi = d => {
    const s = SCALES[song.scale].semis, n = s.length;
    return s[mod(d, n)] + 12 * Math.floor(d / n);
  };
  const rootMidi = base => base + mod(song.key - (base % 12), 12);
  const degMidi = (d, base) => rootMidi(base) + semi(d);
  const degName = d => NOTE_NAMES[mod(song.key + semi(d), 12)];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // ---------- music: engine ----------
  const music = (() => {
    let bus = null, timer = null, nextTime = 0, step = 0, factor = 1, running = false, onStep = null;

    function build() {
      if (bus || !actx) return;
      const master = actx.createGain(), duck = actx.createGain(), mix = actx.createGain();
      mix.connect(duck); duck.connect(master); master.connect(actx.destination);
      const layers = {};
      LAYER_IDS.forEach(k => { const g = actx.createGain(); g.connect(mix); layers[k] = g; });
      const delay = actx.createDelay(1.5), fb = actx.createGain(), lp = actx.createBiquadFilter(), send = actx.createGain();
      lp.type = 'lowpass'; lp.frequency.value = 2400; fb.gain.value = 0.36; send.gain.value = 0.42;
      layers.lead.connect(send); send.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(mix);
      const len = actx.sampleRate, noise = actx.createBuffer(1, len, actx.sampleRate), data = noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      bus = { master, duck, layers, delay, noise };
      applyGain(); tempoFx();
    }
    function applyGain() {
      if (!bus) return;
      const now = actx.currentTime;
      bus.master.gain.cancelScheduledValues(now);
      bus.master.gain.setTargetAtTime(muted ? 0 : song.master * 0.9, now, 0.03);
      LAYER_IDS.forEach(k => bus.layers[k].gain.setTargetAtTime(song[k].mute ? 0 : song[k].vol * LEVEL[k], now, 0.03));
    }
    function tempoFx() {
      if (bus) bus.delay.delayTime.setTargetAtTime(60 / (song.bpm * factor) * 0.75, actx.currentTime, 0.05);
    }

    function osc(type, freq, t, stop, detune) {
      const o = actx.createOscillator();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (detune) o.detune.value = detune;
      o.start(t); o.stop(stop);
      return o;
    }
    function kickV(t) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(1, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.connect(g); g.connect(bus.layers.drums); o.start(t); o.stop(t + 0.35);
    }
    function noiseV(t, dur, hp, peak) {
      const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      s.buffer = bus.noise; f.type = 'highpass'; f.frequency.value = hp;
      g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(bus.layers.drums);
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }
    function snareV(t) {
      noiseV(t, 0.18, 1400, 0.6);
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.1);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(g); g.connect(bus.layers.drums); o.start(t); o.stop(t + 0.16);
    }
    const hatV = t => noiseV(t, 0.05, 7500, 0.28);
    function bassV(t, midi, dur, wave) {
      const g = actx.createGain(), f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(1500, t); f.frequency.exponentialRampToValueAtTime(380, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.7, t + 0.01); g.gain.setTargetAtTime(0.0001, t + dur * 0.9, 0.05);
      osc(wave, hz(midi), t, t + dur + 0.4).connect(f);
      f.connect(g); g.connect(bus.layers.bass);
    }
    function leadV(t, midi, dur, wave) {
      const g = actx.createGain(), f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 3800;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.22, t + dur * 0.5); g.gain.setTargetAtTime(0.0001, t + dur, 0.06);
      [-7, 7].forEach(dt => osc(wave, hz(midi), t, t + dur + 0.5, dt).connect(f));
      f.connect(g); g.connect(bus.layers.lead);
    }
    function padV(t, midis, dur, wave) {
      const g = actx.createGain(), f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 1200; f.Q.value = 0.5;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5 / midis.length, t + 0.3); g.gain.setTargetAtTime(0.0001, t + dur, 0.25);
      midis.forEach(m => [-8, 8].forEach(dt => osc(wave, hz(m), t, t + dur + 1.6, dt).connect(f)));
      f.connect(g); g.connect(bus.layers.pad);
    }

    function chordMidis(r) {
      const n = SCALES[song.scale].semis.length;
      r = r % n;
      const rr = r >= 4 ? r - n : r;
      return [rr, rr + 2, rr + 4].map(d => degMidi(d, BASE.pad));
    }
    const stepDur = () => 60 / (song.bpm * factor) / 2;
    function playStep(s, t) {
      const sd = stepDur();
      if (song.drums.kick[s]) kickV(t);
      if (song.drums.snare[s]) snareV(t);
      if (song.drums.hat[s]) hatV(t);
      const b = song.bass.notes[s];
      if (b !== null) bassV(t, degMidi(b, BASE.bass), sd * 0.92, song.bass.wave);
      const l = song.lead.notes[s];
      if (l !== null) leadV(t, degMidi(l, BASE.lead), sd * 0.85, song.lead.wave);
      if (s % PAD_SLOT === 0) {
        const c = song.pad.chords[s / PAD_SLOT];
        if (c !== null) padV(t, chordMidis(c), sd * PAD_SLOT * 1.02, song.pad.wave);
      }
    }
    function tick() {
      const now = actx.currentTime;
      if (nextTime < now - 0.25) nextTime = now + 0.05;
      while (nextTime < now + 0.12) {
        playStep(step, nextTime);
        if (onStep) {
          const s = step;
          setTimeout(() => { if (running) onStep(s); }, Math.max(0, (nextTime - now) * 1000));
        }
        nextTime += stepDur();
        step = (step + 1) % STEPS;
      }
    }

    function start() {
      ensureAudio();
      if (!actx) return;
      build();
      stop(0, true);
      applyGain();
      running = true; step = 0; nextTime = actx.currentTime + 0.1;
      tick(); timer = setInterval(tick, 25);
    }
    function stop(fade, quiet) {
      if (timer) { clearInterval(timer); timer = null; }
      running = false;
      if (bus && !quiet) {
        const now = actx.currentTime;
        bus.master.gain.cancelScheduledValues(now);
        bus.master.gain.setTargetAtTime(0, now, fade ? fade / 3 : 0.04);
      }
      if (onStep) onStep(-1);
    }
    function duck() {
      if (!bus) return;
      const now = actx.currentTime, g = bus.duck.gain;
      g.cancelScheduledValues(now); g.setValueAtTime(0.25, now); g.linearRampToValueAtTime(1, now + 0.7);
    }
    function setFactor(f) {
      if (Math.abs(f - factor) < 0.001) return;
      factor = f; tempoFx();
    }
    function audition(layer, val) {
      ensureAudio();
      if (!actx) return;
      build(); applyGain();
      const t = actx.currentTime + 0.01;
      if (layer === 'drums') { if (val === 'kick') kickV(t); else if (val === 'snare') snareV(t); else hatV(t); }
      else if (layer === 'bass') bassV(t, degMidi(val, BASE.bass), 0.3, song.bass.wave);
      else if (layer === 'lead') leadV(t, degMidi(val, BASE.lead), 0.3, song.lead.wave);
      else padV(t, chordMidis(val), 0.9, song.pad.wave);
    }
    return {
      start, stop, duck, setFactor, audition, applyGain,
      sync() { applyGain(); tempoFx(); },
      setStepHandler(fn) { onStep = fn; }
    };
  })();

  // ---------- boot ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (W && H) { if (!paused) update(dt); renderThumb(); draw(); }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(app);
  try {
    document.fonts.load('700 24px Fredoka');
    document.fonts.load('600 14px "Chakra Petch"');
    document.fonts.ready.then(resize);
  } catch (e) {}

  resize();
  newRound();
  showStart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
