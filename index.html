<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1f">
<style>[hidden]{display:none!important}</style>
<title>Factor Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Fredoka:wght@500;700&display=swap">
<style>
  :root {
    /* Layout: one-screen canvas game. The HUD floats over the top, the ship sits low,
       and everything streams out of a vanishing point just under the HUD. */
    --space-0: #070a1f;
    --space-1: #111742;
    --ink: #eef1ff;
    --ink-dim: #8f99d4;
    --track: #232b63;
    --cell: #161c4d;
    --cell-alt: #1e2662;
    --gold: #ffc857;
    --gold-light: #ffe9a0;
    --on-gold: #201600;
    --ice: #7fe3ff;
    --coral: #ff6b8b;
    --mint: #46e0b4;
    --violet: #8b6cff;
    --orange: #ff9a5a;
    --pink: #ff7aa8;
    --blue: #5aa8ff;
    --font-display: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
    --font-ui: 'Chakra Petch', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  html { box-sizing: border-box; height: 100%; background: var(--space-0); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%; margin: 0; background: var(--space-0); color: var(--ink);
    font-family: var(--font-ui); font-size: 16px; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #app { position: relative; height: 100%; overflow: hidden; background: var(--space-0); }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud {
    position: relative; z-index: 5; pointer-events: none; padding: 12px 16px 0;
    background: linear-gradient(to bottom, color-mix(in srgb, var(--space-0) 88%, transparent), color-mix(in srgb, var(--space-0) 0%, transparent));
  }
  .bar { display: flex; align-items: center; gap: 12px; }
  .shields { display: flex; gap: 6px; margin-right: auto; }
  .shield { width: 20px; height: 22px; fill: var(--ice); stroke: var(--ice); transition: fill .2s, stroke .2s, opacity .2s; }
  .shield.lost { fill: transparent; stroke: var(--ink-dim); opacity: .55; }
  .tally { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .tally .of { color: var(--ink-dim); font-weight: 500; }
  #mute {
    pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--track);
    background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer;
  }
  #mute:focus-visible, .btn:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
  #mute.off .waves { display: none; }
  #mute:not(.off) .slash { display: none; }
  .meter { display: flex; gap: 4px; margin-top: 8px; }
  .meter i { flex: 1; height: 6px; border-radius: 3px; background: var(--track); transition: background .25s; }
  .meter i.on { background: var(--gold); }

  .target { display: flex; flex-direction: column; align-items: center; margin-top: 12px; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); text-align: center; }
  .num {
    font-family: var(--font-display); font-weight: 700; font-size: clamp(68px, 20vw, 104px); line-height: 1;
    margin-top: 2px; color: var(--gold); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 28px color-mix(in srgb, var(--gold) 45%, transparent);
    transition: text-shadow .3s;
  }
  #hud.done .num { text-shadow: 0 0 44px color-mix(in srgb, var(--gold) 90%, transparent); }
  .num { white-space: nowrap; }
  .num.term { font-size: clamp(56px, 17vw, 92px); }
  .num.term-long { font-size: clamp(40px, 12vw, 76px); }
  .eq { display: flex; align-items: center; gap: 12px; margin-top: 6px; padding-bottom: 12px; }
  .times { font-family: var(--font-display); font-size: 26px; color: var(--ink-dim); }
  .slot {
    width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 700; font-size: 30px;
    border: 2px dashed var(--ink-dim); color: var(--ink-dim);
  }
  .slot.filled { border-style: solid; border-color: var(--gold); background: var(--gold); color: var(--on-gold); }
  .slot.pop { animation: pop .3s ease-out; }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

  #controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; align-items: center; gap: 12px;
    padding: 18px 16px 16px; touch-action: none;
    background: linear-gradient(to top, color-mix(in srgb, var(--space-0) 96%, transparent) 72%, color-mix(in srgb, var(--space-0) 0%, transparent));
  }
  .arrow {
    flex: none; width: 60px; height: 60px; border-radius: 16px; border: 1.5px solid var(--track);
    background: color-mix(in srgb, var(--space-1) 85%, transparent); color: var(--ink);
    display: grid; place-items: center; cursor: pointer; touch-action: none;
  }
  .arrow:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
  .arrow.held { background: var(--track); }
  #track {
    position: relative; flex: 1; min-width: 0; height: 60px; border-radius: 30px; cursor: grab; touch-action: none;
    background: var(--space-1); border: 1.5px solid var(--track);
  }
  #track::before {
    content: ''; position: absolute; left: 28px; right: 28px; top: 50%; height: 4px; margin-top: -2px;
    border-radius: 2px; background: var(--track);
  }
  #thumb {
    position: absolute; left: 0; top: 4px; bottom: 4px; width: 72px; border-radius: 26px; background: var(--gold);
    box-shadow: 0 0 18px color-mix(in srgb, var(--gold) 40%, transparent);
    display: grid; place-items: center; will-change: transform;
  }
  #thumb::after {
    content: ''; width: 24px; height: 18px; border-radius: 2px; opacity: .5;
    background: repeating-linear-gradient(90deg, var(--on-gold) 0 3px, transparent 3px 9px);
  }

  #flash {
    position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 40%, color-mix(in srgb, var(--coral) 55%, transparent) 100%);
  }
  #flash.hit { animation: flash .45s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  #app.shake { animation: shake .35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(3px); }
  }

  /* Menus: one centred panel. margin:auto centres it both ways and still lets a tall panel scroll. */
  #overlay {
    position: absolute; inset: 0; z-index: 10; display: flex; overflow-y: auto; padding: 24px 16px 32px;
    background: color-mix(in srgb, var(--space-0) 86%, transparent);
  }
  #overlay.solid { background: color-mix(in srgb, var(--space-0) 95%, transparent); }
  #app.menu #hud, #app.menu #controls { visibility: hidden; }
  .panel { margin: auto; width: 100%; max-width: 30rem; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .panel.wide { max-width: 64rem; }
  .cols { width: 100%; display: flex; flex-direction: column; align-items: center; }
  .col { width: 100%; max-width: 30rem; display: flex; flex-direction: column; align-items: center; }
  @media (min-width: 860px) {
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; justify-items: center; }
  }
  .kicker { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ice); }
  #overlay h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 14vw, 64px);
    line-height: 1; color: var(--gold); text-wrap: balance;
  }
  .lede { margin: 14px 0 0; font-size: 18px; line-height: 1.45; }
  .hint { margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-dim); }
  .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 28px; margin: 18px 0 0; }
  .stats div { display: flex; flex-direction: column; gap: 2px; }
  .stats dt { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .stats dd { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums; }
  .btn {
    min-height: 54px; padding: 12px 30px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--gold); color: var(--on-gold); font-family: var(--font-display); font-weight: 700; font-size: 22px;
  }
  .btn:active { transform: translateY(1px); }
  .btn.big { width: 100%; max-width: 22rem; min-height: 68px; font-size: 28px; margin-top: 20px; box-shadow: 0 0 28px color-mix(in srgb, var(--gold) 35%, transparent); }
  .btn.ghost {
    background: transparent; color: var(--ice); border: 1.5px solid var(--track);
    font-size: 18px; min-height: 48px; padding: 8px 22px;
  }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; margin-top: 22px; }
  .who { margin: 22px 0 0; font-family: var(--font-display); font-weight: 700; font-size: 22px; }
  .who + .actions { margin-top: 10px; }
  .pilot { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .sec { margin: 26px 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .chip {
    padding: 4px 11px; border-radius: 999px; background: var(--cell-alt); color: var(--ink);
    font-family: var(--font-display); font-weight: 700; font-size: 16px; white-space: nowrap;
  }
  .chip.good { background: var(--mint); color: var(--space-0); }
  .chip.ok { background: var(--gold); color: var(--on-gold); }
  .chip.bad { background: var(--coral); color: var(--space-0); }

  .runs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: 100%; }
  .run {
    min-height: 56px; border-radius: 12px; border: 1.5px solid var(--track); background: var(--space-1); color: var(--gold);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer;
    font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1;
  }
  .run small { font-family: var(--font-ui); font-weight: 600; font-size: 11px; color: var(--ink-dim); }
  .run:hover { border-color: var(--gold); }
  .run:focus-visible { outline: 3px solid var(--ice); outline-offset: 2px; }

  .grid { display: grid; gap: 2px; width: 100%; margin-top: 8px; }
  .grid span {
    aspect-ratio: 1; display: grid; place-items: center; border-radius: 4px;
    font-size: clamp(9px, 2.6vw, 12px); font-variant-numeric: tabular-nums;
    background: var(--cell); color: var(--ink-dim);
  }
  .grid .h { background: transparent; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: clamp(11px, 3vw, 14px); }
  .grid .good { background: var(--mint); color: var(--space-0); }
  .grid .ok { background: var(--gold); color: var(--on-gold); }
  .grid .bad { background: var(--coral); color: var(--space-0); }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--ink-dim); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--cell); }
  .legend .good { background: var(--mint); }
  .legend .ok { background: var(--gold); }
  .legend .bad { background: var(--coral); }
  .slot.miss { border-style: solid; border-color: var(--coral); background: var(--coral); color: var(--space-0); }


  @media (prefers-reduced-motion: reduce) {
    #app.shake { animation: none; }
    #flash.hit { animation-duration: .15s; }
    .slot.pop { animation: none; }
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="stage" role="img" aria-label="Game field"></canvas>

  <div id="hud">
    <div class="bar">
      <div class="shields" id="shields" role="img" aria-label="Shields"></div>
      <span class="pilot" id="pilot"></span>
      <div class="tally" aria-label="Pairs caught"><span id="done">0</span><span class="of">/10</span></div>
      <button id="mute" type="button" aria-label="Turn sound off">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/>
          <g class="waves"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></g>
          <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
    </div>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="target" aria-live="polite">
      <div class="label" id="label">Catch two numbers that multiply to</div>
      <div class="num" id="target">42</div>
      <div class="eq">
        <div class="slot" id="slotA">?</div>
        <div class="times" id="times">×</div>
        <div class="slot" id="slotB">?</div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="arrow" id="btnL" type="button" aria-label="Move left">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div id="track" title="Slide to steer"><div id="thumb"></div></div>
    <button class="arrow" id="btnR" type="button" aria-label="Move right">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div id="flash"></div>
  <div id="overlay"></div>

</div>

<script>
(() => {
  'use strict';

  // MIN and MAX set which times tables show up. ROUNDS is facts per mission.
  // HISTORY is how many recent answers per fact count toward progress; older ones are dropped.
  const CFG = { MIN: 2, MAX: 12, ROUNDS: 10, SHIELDS: 3, HISTORY: 10, LANES: 4 };
  const LIM = 0.9;
  const PLAYERS = ['Mason', 'Macauley'];
  const PKEY = 'factor-flight-players';

  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  };
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  const cs = getComputedStyle(document.documentElement);
  const tok = n => cs.getPropertyValue(n).trim();
  const COL = {
    space0: tok('--space-0'), space1: tok('--space-1'), ink: tok('--ink'),
    gold: tok('--gold'), goldLight: tok('--gold-light'), onGold: tok('--on-gold'),
    ice: tok('--ice'), coral: tok('--coral'), mint: tok('--mint'), violet: tok('--violet'),
    orange: tok('--orange'), pink: tok('--pink'), blue: tok('--blue')
  };
  const PLANETS = [COL.violet, COL.mint, COL.orange, COL.pink, COL.blue];
  const STAR_TINTS = [COL.ink, COL.ink, COL.ice, COL.gold];
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  };
  const FONT = "'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif";

  const app = $('app'), cv = $('stage'), ctx = cv.getContext('2d');
  const overlay = $('overlay'), hud = $('hud'), flashEl = $('flash');

  // ---------- layout ----------
  let W = 0, H = 0, dpr = 1, vpX = 0, vpY = 0, shipY = 0, halfW = 0, objR = 26;
  let bgGrad, nebA, nebB, glow;

  function resize() {
    const r = app.getBoundingClientRect();
    W = r.width; H = r.height;
    if (!W || !H) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const hudBottom = hud.getBoundingClientRect().bottom - r.top;
    vpX = W / 2;
    vpY = clamp(hudBottom + 36, H * 0.3, H * 0.46);
    // The ship sits above the steering bar so a thumb on the bar never covers it.
    shipY = H - $('controls').getBoundingClientRect().height - 52;
    halfW = W / 2 - 12;
    objR = clamp(W * 0.07, 20, 34);

    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, COL.space0);
    bgGrad.addColorStop(1, COL.space1);
    nebA = ctx.createRadialGradient(W * 0.88, H * 0.58, 0, W * 0.88, H * 0.58, W * 0.9);
    nebA.addColorStop(0, rgba(COL.violet, 0.2)); nebA.addColorStop(1, rgba(COL.violet, 0));
    nebB = ctx.createRadialGradient(W * 0.06, H * 0.4, 0, W * 0.06, H * 0.4, W * 0.8);
    nebB.addColorStop(0, rgba(COL.mint, 0.13)); nebB.addColorStop(1, rgba(COL.mint, 0));
    glow = ctx.createRadialGradient(vpX, vpY, 0, vpX, vpY, W * 0.75);
    glow.addColorStop(0, rgba(COL.gold, 0.3)); glow.addColorStop(0.18, rgba(COL.gold, 0.1)); glow.addColorStop(1, rgba(COL.gold, 0));
  }

  // ---------- perspective ----------
  // u runs 0 (at the vanishing point) to 1 (level with the ship) and beyond (passing under it).
  function project(wx, u) {
    const f = Math.pow(u, 1.5);
    const k = 0.35 + 0.65 * f;
    return { x: vpX + wx * halfW * k, y: vpY + (shipY - vpY) * f, k };
  }

  // ---------- audio ----------
  let actx = null, muted = false;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  }
  function tone(freq, dur, type, vol, delay, slideTo) {
    if (!actx || muted) return;
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  const sfx = {
    pick() { tone(660, 0.1, 'triangle', 0.12); tone(990, 0.14, 'triangle', 0.1, 0.07); },
    wrong() { tone(170, 0.3, 'sawtooth', 0.09, 0, 80); },
    round() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.11, i * 0.08)); },
    win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.24, 'triangle', 0.12, i * 0.11)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.26, 'sine', 0.12, i * 0.15)); }
  };
  $('mute').addEventListener('click', () => {
    muted = !muted;
    $('mute').classList.toggle('off', muted);
    $('mute').setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
    music.applyGain();
    if (!muted) { ensureAudio(); sfx.pick(); }
  });

  // ---------- players ----------
  // Per player: games and wins (missions), best mission time, best speedrun time per table (speed),
  // and for each fact ("3x7", smaller number first) h = the last CFG.HISTORY answers, '1' right and '0' wrong.
  let player = null;
  const db = (() => {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(PKEY)); } catch (e) {}
    if (!d || typeof d !== 'object') d = {};
    // Older saves kept lifetime right and wrong counts. Keep only the recent history.
    Object.keys(d).forEach(name => {
      const facts = (d[name] && d[name].facts) || {};
      Object.keys(facts).forEach(k => {
        const h = facts[k] && facts[k].h;
        if (h) facts[k] = { h: String(h).slice(-CFG.HISTORY) }; else delete facts[k];
      });
    });
    return d;
  })();
  const saveDb = () => { try { localStorage.setItem(PKEY, JSON.stringify(db)); } catch (e) {} };
  function rec(name) {
    const r = db[name] || (db[name] = {});
    r.games = r.games || 0; r.wins = r.wins || 0; r.best = r.best || null;
    r.facts = r.facts || {}; r.speed = r.speed || {};
    return r;
  }
  const factKey = (a, b) => Math.min(a, b) + 'x' + Math.max(a, b);
  function logFact(a, b, ok) {
    if (!player) return;
    const facts = rec(player).facts, k = factKey(a, b);
    const e = facts[k] || (facts[k] = { h: '' });
    e.h = (e.h + (ok ? '1' : '0')).slice(-CFG.HISTORY);
    saveDb();
  }
  const pct = e => e && e.h ? e.h.split('').filter(c => c === '1').length / e.h.length : 0;
  // Mastery from the recent answers only, so old mistakes fade once a fact is learned.
  function factLevel(e) {
    if (!e || !e.h) return '';
    const p = pct(e);
    if (e.h.length >= 3 && p >= 0.8) return 'good';
    return p >= 0.5 ? 'ok' : 'bad';
  }
  function allFacts() {
    const out = [];
    for (let a = CFG.MIN; a <= CFG.MAX; a++) for (let b = a; b <= CFG.MAX; b++) out.push([a, b]);
    return out;
  }
  // A mission picks CFG.ROUNDS facts: the shakiest ones first (needs practice, then learning),
  // up to 8 of them, then facts not seen yet, then known facts with the lowest score as review.
  function planMission(name) {
    const facts = rec(name).facts;
    const all = allFacts().map(([a, b]) => { const e = facts[factKey(a, b)]; return { a, b, e, lv: factLevel(e), r: Math.random() }; });
    const trouble = all.filter(f => f.lv === 'bad' || f.lv === 'ok')
      .sort((x, y) => (x.lv === 'bad' ? 0 : 1) - (y.lv === 'bad' ? 0 : 1) || pct(x.e) - pct(y.e) || x.r - y.r);
    const fresh = shuffle(all.filter(f => !f.lv));
    const known = all.filter(f => f.lv === 'good').sort((x, y) => pct(x.e) - pct(y.e) || x.r - y.r);
    const plan = trouble.slice(0, 8);
    for (const f of fresh.concat(trouble.slice(8), known)) { if (plan.length >= CFG.ROUNDS) break; plan.push(f); }
    return plan;
  }

  // ---------- state ----------
  let state = 'ready'; // ready | playing | interlude | won | lost
  const ship = { wx: 0, target: 0, bank: 0, pulse: 0, pulseCol: COL.gold };
  let objs = [], parts = [], stars = [];
  let round = null, done = 0, shields = CFG.SHIELDS, wrongCount = 0, kinds = [];
  let spawnT = 0, sinceNeeded = 0, interludeT = 0, tAnim = 0, warp = 0.6, worldAlpha = 1, startTime = 0;
  // mode 'mission': plan is the list of facts, one per round.
  // mode 'speed': speedN is the chosen table, queue holds the other factors still to answer right.
  let mode = 'mission', plan = [], speedN = 0, queue = [], missed = new Set(), total = CFG.ROUNDS;

  const progress = () => clamp(done / Math.max(1, total - 1), 0, 1);
  const travelTime = () => mode === 'speed' ? lerp(3.4, 2.4, progress()) : lerp(5.0, 3.8, progress());
  const spawnEvery = () => travelTime() / 6.5;

  // Speedrun lanes, in world x.
  const laneX = i => lerp(-0.72, 0.72, i / (CFG.LANES - 1));
  const nearestLane = wx => clamp(Math.round((wx + 0.72) / 1.44 * (CFG.LANES - 1)), 0, CFG.LANES - 1);
  const stepLane = d => { ship.target = laneX(clamp(nearestLane(ship.target) + d, 0, CFG.LANES - 1)); };

  // ---------- HUD ----------
  const SHIELD_SVG = '<svg class="shield" viewBox="0 0 20 22" aria-hidden="true"><path d="M10 1.5 18 4.5v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10v-6z" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  $('shields').innerHTML = SHIELD_SVG.repeat(CFG.SHIELDS);
  function setupHud() {
    $('meter').innerHTML = '<i></i>'.repeat(total);
    document.querySelector('.tally .of').textContent = '/' + total;
    $('shields').style.visibility = mode === 'speed' ? 'hidden' : '';
  }
  setupHud();

  function setSlot(el, val, pop) {
    if (val === null || val === undefined) {
      el.textContent = '?'; el.classList.remove('filled', 'pop');
    } else {
      el.textContent = val; el.classList.add('filled');
      if (pop) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    }
  }
  function renderHud(popA, popB) {
    const kind = round.kind, single = kind !== 'factors';
    $('target').textContent = kind === 'product' ? round.a + ' × ' + round.b
      : kind === 'missing' ? round.a + ' × ? = ' + round.product : round.product;
    $('target').classList.toggle('term', kind === 'product');
    $('target').classList.toggle('term-long', kind === 'missing');
    const verb = mode === 'speed' ? 'Fly into ' : 'Catch ';
    $('label').textContent = kind === 'product' ? verb + 'the answer to'
      : kind === 'missing' ? verb + 'the missing number' : 'Catch two numbers that multiply to';
    $('slotA').hidden = single;
    $('times').hidden = single;
    setSlot($('slotA'), round.picked, popA);
    setSlot($('slotB'), round.complete || round.missed ? (single ? round.answer : round.need) : null, popB);
    $('slotB').classList.toggle('miss', !!round.missed);
    hud.classList.toggle('done', !!round.complete);
    $('done').textContent = done;
    [].forEach.call($('meter').children, (el, i) => el.classList.toggle('on', i < done));
    [].forEach.call($('shields').children, (el, i) => el.classList.toggle('lost', i >= shields));
  }

  // ---------- rounds ----------
  function newRound() {
    let a, b, k = 0, KINDS;
    if (mode === 'speed') {
      k = queue.shift(); a = speedN; b = k;
      KINDS = ['product', 'missing'];
    } else {
      const f = plan[done] || { a: randInt(CFG.MIN, CFG.MAX), b: randInt(CFG.MIN, CFG.MAX) };
      a = f.a; b = f.b;
      KINDS = ['factors', 'product', 'missing'];
    }
    // Round types mixed at random, rarely repeating and never three of the same kind in a row.
    const last = kinds[kinds.length - 1];
    let kind = pick(KINDS);
    if (kind === last && (kinds[kinds.length - 2] === last || Math.random() < 0.6)) kind = pick(KINDS.filter(x => x !== last));
    kinds.push(kind);
    // A speedrun missing-number question always shows the chosen table, so the answer is the other factor.
    if (!(mode === 'speed' && kind === 'missing') && Math.random() < 0.5) [a, b] = [b, a];
    const p = a * b;
    round = {
      kind, product: p, a, b, k, valid: [], pool: [], picked: null, need: null, complete: false, missed: false, spawned: false,
      answer: kind === 'product' ? p : kind === 'missing' ? b : null
    };
    if (kind === 'factors') {
      for (let d = CFG.MIN; d <= CFG.MAX; d++) {
        if (p % d === 0) { const q = p / d; if (q >= CFG.MIN && q <= CFG.MAX) round.valid.push(d); }
      }
    } else if (kind === 'product') {
      // Wrong answers a learner might really pick, plus a few random products.
      const near = [a * (b - 1), a * (b + 1), (a - 1) * b, (a + 1) * b, a + b, p - 10, p + 10, p - 1, p + 1];
      const nearOk = near.filter((v, i) => v >= 2 && v !== p && near.indexOf(v) === i);
      const rand = [];
      for (let i = 0; i < 4; i++) {
        const v = randInt(CFG.MIN, CFG.MAX) * randInt(CFG.MIN, CFG.MAX);
        if (v !== p) rand.push(v);
      }
      round.pool = nearOk.concat(nearOk, rand);
    } else {
      // Wrong factors a learner might pick: neighbours of the answer, the known factor, or subtracting instead of dividing.
      const near = [b - 1, b + 1, b - 2, b + 2, a, p - a];
      const nearOk = near.filter((v, i) => v >= 2 && v !== b && near.indexOf(v) === i);
      const rand = [];
      for (let i = 0; i < 3; i++) {
        const v = randInt(CFG.MIN, CFG.MAX);
        if (v !== b) rand.push(v);
      }
      round.pool = nearOk.concat(nearOk, rand);
    }
    objs = []; worldAlpha = 0; spawnT = mode === 'speed' ? 0.15 : 0.5; sinceNeeded = 0;
    renderHud();
  }

  function makeObj(val, wx) {
    const roll = Math.random();
    const type = roll < 0.4 ? 'star' : roll < 0.75 ? 'planet' : 'comet';
    return {
      type, val, wx, u: 0, checked: false, dead: false,
      col: type === 'star' ? COL.gold : type === 'comet' ? COL.ice : pick(PLANETS),
      ring: type === 'planet' && Math.random() < 0.5, tilt: rnd(-0.5, 0.5), spin: rnd(0.6, 1.2) * (Math.random() < 0.5 ? -1 : 1)
    };
  }

  function spawn() {
    let val;
    sinceNeeded++;
    const force = sinceNeeded >= 3 || Math.random() < 0.34;
    if (round.kind !== 'factors') {
      if (force) { val = round.answer; sinceNeeded = 0; }
      else val = pick(round.pool);
    } else {
      const needSet = round.picked === null ? round.valid : [round.need];
      if (force) { val = pick(needSet); sinceNeeded = 0; }
      else {
        const pool = [];
        for (let v = CFG.MIN; v <= CFG.MAX; v++) if (needSet.indexOf(v) < 0) pool.push(v);
        val = pick(pool);
      }
    }
    let bx = 0, bd = -1;
    for (let i = 0; i < 6; i++) {
      const x = rnd(-0.88, 0.88);
      let d = 9;
      for (const o of objs) if (o.u < 0.4) d = Math.min(d, Math.abs(o.wx - x));
      if (d > bd) { bd = d; bx = x; }
    }
    objs.push(makeObj(val, bx));
  }

  // Speedrun: one row of answers, one per lane, with the question riding on a gate above it.
  function spawnWave() {
    const wrong = [];
    const add = v => { if (v >= 1 && v !== round.answer && wrong.indexOf(v) < 0 && wrong.length < CFG.LANES - 1) wrong.push(v); };
    shuffle(round.pool.slice()).forEach(add);
    while (wrong.length < CFG.LANES - 1) add(round.kind === 'product' ? randInt(CFG.MIN, CFG.MAX) * randInt(CFG.MIN, CFG.MAX) : randInt(CFG.MIN, CFG.MAX));
    const wave = { label: round.kind === 'product' ? round.a + ' × ' + round.b : round.a + ' × ? = ' + round.product, objs: [], checked: false };
    shuffle(wrong.concat(round.answer)).forEach((val, lane) => {
      const o = makeObj(val, laneX(lane));
      o.wave = wave; o.lane = lane;
      wave.objs.push(o); objs.push(o);
    });
  }
  // The row reached the ship: whichever lane the ship is in is the answer.
  function resolveWave(w) {
    w.checked = true;
    w.objs.forEach(o => { o.checked = true; });
    // Use the lane the player steered to, even if the ship is still sliding into it.
    const o = w.objs[nearestLane(ship.target)];
    o.dead = true;
    onLane(o, vpX + o.wx * halfW, shipY);
  }

  // ---------- capture ----------
  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = rnd(70, 260);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.35, 0.7), max: 0.7, col, size: rnd(1.5, 3.5) });
    }
  }
  function floater(x, y, text, col) {
    parts.push({ x, y, vx: 0, vy: -70, life: 0.9, max: 0.9, col, text, size: objR * 1.3 });
  }

  // Each catch is logged against one fact: the round's a x b, or in a factors round
  // the pair the player is building once they have caught the first number.
  function onCapture(o, x, y) {
    if (round.kind !== 'factors') {
      const ok = o.val === round.answer;
      logFact(round.a, round.b, ok);
      if (ok) {
        round.complete = true; done++;
        goodHit(o, x, y); renderHud(false, true);
        state = 'interlude'; interludeT = 1.2; sfx.round();
      } else badHit(x, y);
      return;
    }
    if (round.picked === null) {
      if (round.valid.indexOf(o.val) >= 0) {
        round.picked = o.val; round.need = round.product / o.val;
        goodHit(o, x, y); renderHud(true, false); sfx.pick();
      } else { logFact(round.a, round.b, false); badHit(x, y); }
    } else if (o.val === round.need) {
      logFact(round.picked, round.need, true);
      round.complete = true; done++;
      goodHit(o, x, y); renderHud(false, true);
      state = 'interlude'; interludeT = 1.2; sfx.round();
    } else { logFact(round.picked, round.need, false); badHit(x, y); }
  }
  // A speedrun miss costs no shield. The slot shows the right answer and the question comes back later.
  function onLane(o, x, y) {
    const ok = o.val === round.answer;
    logFact(round.a, round.b, ok);
    if (ok) {
      round.complete = true; done++;
      goodHit(o, x, y); renderHud(false, true); sfx.pick();
      state = 'interlude'; interludeT = 0.45;
    } else {
      round.missed = true; missed.add(round.k); queue.push(round.k);
      wrongCount++; hitFx(x, y); renderHud(false, true); sfx.wrong();
      state = 'interlude'; interludeT = 1.0;
    }
  }
  function goodHit(o, x, y) {
    burst(x, y, o.col, 20); floater(x, y - objR, String(o.val), COL.gold);
    ship.pulse = 1; ship.pulseCol = COL.gold;
  }
  function hitFx(x, y) {
    music.duck();
    burst(x, y, COL.coral, 22);
    ship.pulse = 1; ship.pulseCol = COL.coral;
    flashEl.classList.remove('hit'); void flashEl.offsetWidth; flashEl.classList.add('hit');
    app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake');
  }
  function badHit(x, y) {
    shields--; wrongCount++;
    hitFx(x, y); renderHud();
    if (shields <= 0) lose(); else sfx.wrong();
  }

  // ---------- menus and game flow ----------
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  const factLabel = f => f.a + ' × ' + f.b;
  const btn = (label, act, cls, data) => '<button class="btn' + (cls ? ' ' + cls : '') + '" type="button" data-act="' + act + '"' + (data || '') + '>' + label + '</button>';
  const statsHtml = stats => '<dl class="stats">' + stats.map(s => '<div><dt>' + s[0] + '</dt><dd>' + s[1] + '</dd></div>').join('') + '</dl>';
  const head = (kicker, title) => '<p class="kicker">' + kicker + '</p><h1>' + title + '</h1>';

  // Every clickable element with data-act="name" calls acts[name](element).
  function showPanel(html, acts, opts) {
    opts = opts || {};
    overlay.innerHTML = '<div class="panel' + (opts.wide ? ' wide' : '') + '">' + html + '</div>';
    overlay.classList.toggle('solid', !!opts.solid);
    overlay.hidden = false; overlay.scrollTop = 0;
    app.classList.add('menu');
    const els = overlay.querySelectorAll('[data-act]');
    [].forEach.call(els, el => el.addEventListener('click', () => acts[el.dataset.act](el)));
    try { if (els[0]) els[0].focus({ preventScroll: true }); } catch (e) {}
  }

  function showStart() {
    showPanel(
      head('Times tables', 'Factor Flight') +
      '<p class="lede">Fly through the stars, planets and comets and catch the numbers that fit the top.</p>' +
      '<p class="hint">Steer with the bar at the bottom, the arrow buttons, or the arrow keys. Pick your name to see your progress, then start a mission or a speedrun.</p>' +
      '<p class="who">Who is flying?</p><div class="actions">' + PLAYERS.map(n => btn(n, 'pick', '', ' data-name="' + n + '"')).join('') + '</div>',
      { pick: el => showProfile(el.dataset.name) }
    );
  }

  function showProfile(name) {
    player = name;
    const r = rec(name), lo = CFG.MIN, hi = CFG.MAX;
    const next = planMission(name);

    // Mission summary: the facts this mission will focus on, colored by how well they are known.
    const count = lv => next.filter(f => f.lv === lv).length;
    const summary = [[count('bad'), 'to practice'], [count('ok'), 'still learning'], [count(''), 'new'], [count('good'), 'review']]
      .filter(x => x[0]).map(x => x[0] + ' ' + x[1]);
    const chips = '<div class="chips">' + next.map(f => '<span class="chip ' + f.lv + '">' + factLabel(f) + '</span>').join('') + '</div>';

    // Speedrun picker, one button per times table, with the best time for each.
    let runs = '<div class="runs">';
    for (let n = lo; n <= hi; n++) {
      const best = r.speed[n];
      runs += '<button class="run" type="button" data-act="speed" data-n="' + n + '" aria-label="Speedrun the ' + n + ' times table">' + n +
        '<small>' + (best ? fmt(best) : '-') + '</small></button>';
    }
    runs += '</div>';

    // Progress grid.
    let grid = '<div class="grid" role="img" aria-label="Times table progress for ' + name + '" style="grid-template-columns: repeat(' + (hi - lo + 2) + ', 1fr)">';
    grid += '<span class="h">×</span>';
    for (let b = lo; b <= hi; b++) grid += '<span class="h">' + b + '</span>';
    let known = 0, facts = 0, right = 0, tries = 0;
    for (let a = lo; a <= hi; a++) {
      grid += '<span class="h">' + a + '</span>';
      for (let b = lo; b <= hi; b++) {
        const e = r.facts[factKey(a, b)], lv = factLevel(e);
        if (a <= b) {
          facts++; if (lv === 'good') known++;
          if (e) { tries += e.h.length; right += e.h.split('').filter(c => c === '1').length; }
        }
        const tip = a + ' × ' + b + ' = ' + a * b + (e ? ': ' + Math.round(pct(e) * 100) + '% of the last ' + e.h.length : ': not seen yet');
        grid += '<span class="' + lv + '" title="' + tip + '">' + a * b + '</span>';
      }
    }
    grid += '</div>';
    grid += '<div class="legend"><span><i class="good"></i>Knows it</span><span><i class="ok"></i>Learning</span><span><i class="bad"></i>Needs practice</span><span><i></i>Not seen yet</span></div>';

    const others = PLAYERS.filter(p => p !== name);
    showPanel(
      '<div class="cols"><div class="col">' +
        head('Pilot', name) +
        btn('Start mission', 'mission', 'big') +
        '<p class="sec">This mission</p>' + chips +
        '<p class="hint">Focus: ' + summary.join(', ') + '.</p>' +
        '<p class="sec">Speedrun one times table</p>' + runs +
        '<p class="hint">Every question uses your number. Steer into the lane with the answer.</p>' +
      '</div><div class="col">' +
        statsHtml([['Known', known + '/' + facts], ['Score', tries ? Math.round(right / tries * 100) + '%' : '-'],
          ['Missions', r.games], ['Best mission', r.best ? fmt(r.best) : '-']]) +
        '<p class="sec">Times tables</p>' + grid +
        '<p class="hint">Colors come from the last ' + CFG.HISTORY + ' answers for each fact.</p>' +
      '</div></div>' +
      '<div class="actions">' + others.map(p => btn('Switch to ' + p, 'switch', 'ghost', ' data-name="' + p + '"')).join('') + btn('Home', 'home', 'ghost') + '</div>',
      {
        mission: () => startMission(next),
        speed: el => startSpeed(+el.dataset.n),
        switch: el => showProfile(el.dataset.name),
        home: showStart
      },
      { wide: true, solid: true }
    );
  }

  function startMission(facts) {
    mode = 'mission';
    plan = shuffle((facts || planMission(player)).slice());
    total = plan.length;
    rec(player).games++; saveDb();
    startGame();
  }

  function startSpeed(n) {
    mode = 'speed'; speedN = n;
    queue = [];
    for (let k = CFG.MIN; k <= CFG.MAX; k++) queue.push(k);
    shuffle(queue); missed.clear();
    total = queue.length;
    startGame();
  }

  function startGame() {
    ensureAudio();
    overlay.hidden = true; overlay.innerHTML = '';
    app.classList.remove('menu');
    $('pilot').textContent = player + (mode === 'speed' ? ' · ' + speedN + ' times' : '');
    done = 0; shields = CFG.SHIELDS; wrongCount = 0;
    parts = []; kinds = []; ship.target = mode === 'speed' ? laneX(1) : 0;
    setupHud();
    newRound();
    startTime = performance.now();
    state = 'playing';
    music.setFactor(1);
    music.start();
  }

  function win() {
    state = 'won';
    const elapsed = (performance.now() - startTime) / 1000;
    const r = rec(player);
    sfx.win(); music.stop(1.2);
    if (mode === 'speed') {
      const best = r.speed[speedN], isBest = !(best > 0) || elapsed < best;
      if (isBest) r.speed[speedN] = elapsed;
      saveDb();
      showPanel(
        head('Speedrun · ' + speedN + ' times table', fmt(elapsed)) +
        '<p class="lede">All ' + total + ' facts in the ' + speedN + ' times table, ' + player + '!</p>' +
        statsHtml([['Right first try', (total - missed.size) + '/' + total], ['Misses', wrongCount]]) +
        '<p class="hint">' + (isBest ? 'New best time for the ' + speedN + ' times table.' : 'Best time for the ' + speedN + ' times table is ' + fmt(best) + '.') + '</p>' +
        '<div class="actions">' + btn('Run again', 'again') + btn('Progress', 'progress', 'ghost') + '</div>',
        { again: () => startSpeed(speedN), progress: () => showProfile(player) }
      );
      return;
    }
    const isBest = !(r.best > 0) || elapsed < r.best;
    r.wins++;
    if (isBest) r.best = elapsed;
    saveDb();
    showPanel(
      head('Mission complete', 'Nice flying, ' + player + '!') +
      '<p class="lede">All ' + total + ' facts done.</p>' +
      statsHtml([['Time', fmt(elapsed)], ['Shields left', shields + '/' + CFG.SHIELDS], ['Wrong catches', wrongCount]]) +
      '<p class="hint">' + (isBest ? 'New best mission time.' : 'Best mission time is ' + fmt(r.best) + '.') + '</p>' +
      '<div class="actions">' + btn('Next mission', 'again') + btn('Progress', 'progress', 'ghost') + '</div>',
      { again: () => startMission(), progress: () => showProfile(player) }
    );
  }

  function lose() {
    state = 'lost'; music.stop(0.5); sfx.lose();
    showPanel(
      head('Shields down', 'Try again, ' + player) +
      '<p class="lede">You got ' + done + ' of ' + total + ' facts.</p>' +
      statsHtml([['Facts', done + '/' + total], ['Wrong catches', wrongCount]]) +
      '<div class="actions">' + btn('Try again', 'again') + btn('Progress', 'progress', 'ghost') + '</div>',
      { again: () => startMission(), progress: () => showProfile(player) }
    );
  }

  // ---------- input ----------
  // In a speedrun the ship snaps to lanes: keys and arrow buttons move one lane per press.
  const snap = () => { if (mode === 'speed') ship.target = laneX(nearestLane(ship.target)); };
  let drag = null;
  const keys = { left: false, right: false };
  app.addEventListener('pointerdown', e => {
    if (state !== 'playing' && state !== 'interlude') return;
    if (e.target.closest('button') || e.target.closest('#controls')) return;
    drag = { x: e.clientX, t: ship.target };
    try { app.setPointerCapture(e.pointerId); } catch (err) {}
  });
  app.addEventListener('pointermove', e => {
    if (!drag) return;
    ship.target = clamp(drag.t + ((e.clientX - drag.x) / halfW) * 1.35, -LIM, LIM);
    snap();
  });
  const endDrag = () => { drag = null; };
  app.addEventListener('pointerup', endDrag);
  app.addEventListener('pointercancel', endDrag);
  const keyDir = e => (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') ? -1 : (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') ? 1 : 0;
  window.addEventListener('keydown', e => {
    const d = keyDir(e);
    if (!d) return;
    e.preventDefault();

  track.addEventListener('pointercancel', endTrack);

  }

  // ---------- starfield ----------

  // ---------- update ----------
  function update(dt) {

    const wTarget = state === 'interlude' ? 2.6 : live ? (speed ? 1.7 : 1) : 0.6;

    const hitDist = Math.max(objR * 2.4, halfW * 0.17);

  // ---------- draw ----------
  function starPath(x, y, ro, ri, rot) {

  // Speedrun lane lines from the vanishing point, with the ship's lane lit up.

    const a = project(laneX(cur) - half, 0), b = project(laneX(cur) + half, 0);

    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y); ctx.closePath(); ctx.fill();

  // The question rides on a gate just above its row of answers.

  function draw() {
    ctx.globalAlpha = 1;
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = nebB; ctx.fillRect(0, 0, W, H);

  const SCALES = {

    dorian: { name: 'Dorian', semis: [0, 2, 3, 5, 7, 9, 10] },

  function defaultSong() {

      v: 1, bpm: 112, key: 9, scale: 'minor', master: 0.55,
      drums: {
        vol: 0.85, mute: false,
        kick: P('x...x...', 'x...x.x.', 'x...x...', 'x...x.x.'),
        snare: P('..x...x.', '..x...x.', '..x...x.', '..x..xxx'),
        hat: P('.x.x.x.x', '.x.x.x.x', '.x.x.x.x', '.x.x.x.x')

        notes: [].concat([0, null, 0, 0, null, 0, null, -2], [-2, null, -2, -2, null, -2, null, 2],

      lead: {

  // ---------- music: engine ----------

      const len = actx.sampleRate, noise = actx.createBuffer(1, len, actx.sampleRate), data = noise.getChannelData(0);

    function osc(type, freq, t, stop, detune) {

      const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      s.buffer = bus.noise; f.type = 'highpass'; f.frequency.value = hp;
      g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(bus.layers.drums);
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }
    function snareV(t) {
      noiseV(t, 0.18, 1400, 0.6);
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.1);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(g); g.connect(bus.layers.drums); o.start(t); o.stop(t + 0.16);
    }
    const hatV = t => noiseV(t, 0.05, 7500, 0.28);
    function bassV(t, midi, dur, wave) {
      const g = actx.createGain(), f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(1500, t); f.frequency.exponentialRampToValueAtTime(380, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.7, t + 0.01); g.gain.setTargetAtTime(0.0001, t + dur * 0.9, 0.05);
      osc(wave, hz(midi), t, t + dur + 0.4).connect(f);
      f.connect(g); g.connect(bus.layers.bass);
    }
    function leadV(t, midi, dur, wave) {
      const g = actx.createGain(), f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 3800;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.22, t + dur * 0.5); g.gain.setTargetAtTime(0.0001, t + dur, 0.06);
      [-7, 7].forEach(dt => osc(wave, hz(midi), t, t + dur + 0.5, dt).connect(f));
      f.connect(g); g.connect(bus.layers.lead);
    }
    function padV(t, midis, dur, wave) {
      const g = actx.createGain(), f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 1200; f.Q.value = 0.5;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5 / midis.length, t + 0.3); g.gain.setTargetAtTime(0.0001, t + dur, 0.25);
      midis.forEach(m => [-8, 8].forEach(dt => osc(wave, hz(m), t, t + dur + 1.6, dt).connect(f)));
      f.connect(g); g.connect(bus.layers.pad);
    }

    function chordMidis(r) {
      const n = SCALES[song.scale].semis.length;
      r = r % n;
      const rr = r >= 4 ? r - n : r;
      return [rr, rr + 2, rr + 4].map(d => degMidi(d, BASE.pad));
    }
    const stepDur = () => 60 / (song.bpm * factor) / 2;
    function playStep(s, t) {
      const sd = stepDur();
      if (song.drums.kick[s]) kickV(t);
      if (song.drums.snare[s]) snareV(t);
      if (song.drums.hat[s]) hatV(t);
      const b = song.bass.notes[s];
      if (b !== null) bassV(t, degMidi(b, BASE.bass), sd * 0.92, song.bass.wave);
      const l = song.lead.notes[s];
      if (l !== null) leadV(t, degMidi(l, BASE.lead), sd * 0.85, song.lead.wave);
      if (s % PAD_SLOT === 0) {
        const c = song.pad.chords[s / PAD_SLOT];
        if (c !== null) padV(t, chordMidis(c), sd * PAD_SLOT * 1.02, song.pad.wave);
      }
    }
    function tick() {
      const now = actx.currentTime;
      if (nextTime < now - 0.25) nextTime = now + 0.05;
      while (nextTime < now + 0.12) {
        playStep(step, nextTime);
        if (onStep) {
          const s = step;
          setTimeout(() => { if (running) onStep(s); }, Math.max(0, (nextTime - now) * 1000));
        }
        nextTime += stepDur();
        step = (step + 1) % STEPS;
      }
    }

    function start() {
      ensureAudio();
      if (!actx) return;
      build();
      stop(0, true);
      applyGain();
      running = true; step = 0; nextTime = actx.currentTime + 0.1;
      tick(); timer = setInterval(tick, 25);
    }
    function stop(fade, quiet) {
      if (timer) { clearInterval(timer); timer = null; }
      running = false;
      if (bus && !quiet) {
        const now = actx.currentTime;
        bus.master.gain.cancelScheduledValues(now);
        bus.master.gain.setTargetAtTime(0, now, fade ? fade / 3 : 0.04);
      }
      if (onStep) onStep(-1);
    }
    function duck() {
      if (!bus) return;
      const now = actx.currentTime, g = bus.duck.gain;
      g.cancelScheduledValues(now); g.setValueAtTime(0.25, now); g.linearRampToValueAtTime(1, now + 0.7);
    }
    function setFactor(f) {
      if (Math.abs(f - factor) < 0.001) return;
      factor = f; tempoFx();
    }
    function audition(layer, val) {
      ensureAudio();
      if (!actx) return;
      build(); applyGain();
      const t = actx.currentTime + 0.01;
      if (layer === 'drums') { if (val === 'kick') kickV(t); else if (val === 'snare') snareV(t); else hatV(t); }
      else if (layer === 'bass') bassV(t, degMidi(val, BASE.bass), 0.3, song.bass.wave);
      else if (layer === 'lead') leadV(t, degMidi(val, BASE.lead), 0.3, song.lead.wave);
      else padV(t, chordMidis(val), 0.9, song.pad.wave);
    }
    return {
      start, stop, duck, setFactor, audition, applyGain,
      sync() { applyGain(); tempoFx(); },
      setStepHandler(fn) { onStep = fn; }
    };
  })();

  // ---------- boot ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (W && H) { update(dt); renderThumb(); draw(); }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(app);
  try {
    document.fonts.load('700 24px Fredoka');
    document.fonts.load('600 14px "Chakra Petch"');
    document.fonts.ready.then(resize);
  } catch (e) {}

  resize();
  newRound();
  showStart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
