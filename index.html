<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1f">
<style>[hidden]{display:none!important}</style>
<title>Factor Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Fredoka:wght@500;700&display=swap">
<style>
  :root {
    /* Layout: one-screen canvas game. The HUD floats over the top, the ship sits low,
       and everything streams out of a vanishing point just under the HUD. */
    --space-0: #070a1f;
    --space-1: #111742;
    --ink: #eef1ff;
    --ink-dim: #8f99d4;
    --track: #232b63;
    --cell: #161c4d;
    --cell-alt: #1e2662;
    --gold: #ffc857;
    --gold-light: #ffe9a0;
    --on-gold: #201600;
    --ice: #7fe3ff;
    --coral: #ff6b8b;
    --mint: #46e0b4;
    --violet: #8b6cff;
    --orange: #ff9a5a;
    --pink: #ff7aa8;
    --blue: #5aa8ff;
    --font-display: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif;
    --font-ui: 'Chakra Petch', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color-scheme: dark;
  }
  html { box-sizing: border-box; height: 100%; background: var(--space-0); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%; margin: 0; background: var(--space-0); color: var(--ink);
    font-family: var(--font-ui); font-size: 16px; overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #app { position: relative; height: 100%; overflow: hidden; background: var(--space-0); }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud {
    position: relative; z-index: 5; pointer-events: none; padding: 12px 16px 0;
    background: linear-gradient(to bottom, color-mix(in srgb, var(--space-0) 88%, transparent), color-mix(in srgb, var(--space-0) 0%, transparent));
  }
  .bar { display: flex; align-items: center; gap: 12px; }
  .shields { display: flex; gap: 6px; margin-right: auto; }
  .shield { width: 20px; height: 22px; fill: var(--ice); stroke: var(--ice); transition: fill .2s, stroke .2s, opacity .2s; }
  .shield.lost { fill: transparent; stroke: var(--ink-dim); opacity: .55; }
  .tally { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
  .tally .of { color: var(--ink-dim); font-weight: 500; }
  #mute {
    pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--track);
    background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer;
  }
  #mute:focus-visible, .btn:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
  #mute.off .waves { display: none; }
  #mute:not(.off) .slash { display: none; }
  .meter { display: flex; gap: 4px; margin-top: 8px; }
  .meter i { flex: 1; height: 6px; border-radius: 3px; background: var(--track); transition: background .25s; }
  .meter i.on { background: var(--gold); }

  .target { display: flex; flex-direction: column; align-items: center; margin-top: 12px; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); text-align: center; }
  .num {
    font-family: var(--font-display); font-weight: 700; font-size: clamp(68px, 20vw, 104px); line-height: 1;
    margin-top: 2px; color: var(--gold); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 28px color-mix(in srgb, var(--gold) 45%, transparent);
    transition: text-shadow .3s;
  }
  #hud.done .num { text-shadow: 0 0 44px color-mix(in srgb, var(--gold) 90%, transparent); }
  .num { white-space: nowrap; }
  .num.term { font-size: clamp(56px, 17vw, 92px); }
  .num.term-long { font-size: clamp(40px, 12vw, 76px); }
  .eq { display: flex; align-items: center; gap: 12px; margin-top: 6px; padding-bottom: 12px; }
  .times { font-family: var(--font-display); font-size: 26px; color: var(--ink-dim); }
  .slot {
    width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center;
    font-family: var(--font-display); font-weight: 700; font-size: 30px;
    border: 2px dashed var(--ink-dim); color: var(--ink-dim);
  }
  .slot.filled { border-style: solid; border-color: var(--gold); background: var(--gold); color: var(--on-gold); }
  .slot.pop { animation: pop .3s ease-out; }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

  #controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 7; display: flex; align-items: center; gap: 12px;
    padding: 18px 16px 16px; touch-action: none;
    background: linear-gradient(to top, color-mix(in srgb, var(--space-0) 96%, transparent) 72%, color-mix(in srgb, var(--space-0) 0%, transparent));
  }
  .arrow {
    flex: none; width: 60px; height: 60px; border-radius: 16px; border: 1.5px solid var(--track);
    background: color-mix(in srgb, var(--space-1) 85%, transparent); color: var(--ink);
    display: grid; place-items: center; cursor: pointer; touch-action: none;
  }
  .arrow:focus-visible { outline: 3px solid var(--ice); outline-offset: 3px; }
  .arrow.held { background: var(--track); }
  #track {
    position: relative; flex: 1; min-width: 0; height: 60px; border-radius: 30px; cursor: grab; touch-action: none;
    background: var(--space-1); border: 1.5px solid var(--track);
  }
  #track::before {
    content: ''; position: absolute; left: 28px; right: 28px; top: 50%; height: 4px; margin-top: -2px;
    border-radius: 2px; background: var(--track);
  }
  #thumb {
    position: absolute; left: 0; top: 4px; bottom: 4px; width: 72px; border-radius: 26px; background: var(--gold);
    box-shadow: 0 0 18px color-mix(in srgb, var(--gold) 40%, transparent);
    display: grid; place-items: center; will-change: transform;
  }
  #thumb::after {
    content: ''; width: 24px; height: 18px; border-radius: 2px; opacity: .5;
    background: repeating-linear-gradient(90deg, var(--on-gold) 0 3px, transparent 3px 9px);
  }

  #flash {
    position: absolute; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 40%, color-mix(in srgb, var(--coral) 55%, transparent) 100%);
  }
  #flash.hit { animation: flash .45s ease-out; }
  @keyframes flash { 0% { opacity: 1; } 100% { opacity: 0; } }
  #app.shake { animation: shake .35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); } 80% { transform: translateX(3px); }
  }

  #overlay {
    position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
    padding: 24px 24px 32px;
    background: linear-gradient(to top, color-mix(in srgb, var(--space-0) 96%, transparent) 15%, color-mix(in srgb, var(--space-0) 62%, transparent) 62%, color-mix(in srgb, var(--space-0) 20%, transparent) 100%);
  }
  #overlay > * { max-width: 26rem; }
  .kicker { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ice); }
  #overlay h1 {
    margin: 0; font-family: var(--font-display); font-weight: 700; font-size: clamp(44px, 14vw, 64px);
    line-height: 1; color: var(--gold); text-wrap: balance;
  }
  .lede { margin: 14px 0 0; font-size: 18px; line-height: 1.45; }
  .hint { margin: 12px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-dim); }
  .stats { display: flex; flex-wrap: wrap; gap: 12px 28px; margin: 18px 0 0; }
  .stats div { display: flex; flex-direction: column; gap: 2px; }
  .stats dt { font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
  .stats dd { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums; }
  .btn {
    margin-top: 22px; min-height: 54px; padding: 12px 30px; border: 0; border-radius: 14px; cursor: pointer;
    background: var(--gold); color: var(--on-gold); font-family: var(--font-display); font-weight: 700; font-size: 22px;
  }
  .btn:active { transform: translateY(1px); }

  .btn.ghost {
    background: transparent; color: var(--ice); border: 1.5px solid var(--track);
    font-size: 18px; min-height: 48px; margin-top: 12px; padding: 8px 22px;
  }


  @media (prefers-reduced-motion: reduce) {
    #app.shake { animation: none; }
    #flash.hit { animation-duration: .15s; }
    .slot.pop { animation: none; }
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="stage" role="img" aria-label="Game field"></canvas>

  <div id="hud">
    <div class="bar">
      <div class="shields" id="shields" role="img" aria-label="Shields"></div>
      <div class="tally" aria-label="Pairs caught"><span id="done">0</span><span class="of">/10</span></div>
      <button id="mute" type="button" aria-label="Turn sound off">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/>
          <g class="waves"><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a8 8 0 0 1 0 11"/></g>
          <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
      </button>
    </div>
    <div class="meter" id="meter" aria-hidden="true"></div>
    <div class="target" aria-live="polite">
      <div class="label" id="label">Catch two numbers that multiply to</div>
      <div class="num" id="target">42</div>
      <div class="eq">
        <div class="slot" id="slotA">?</div>
        <div class="times" id="times">×</div>
        <div class="slot" id="slotB">?</div>
      </div>
    </div>
  </div>

  <div id="controls">
    <button class="arrow" id="btnL" type="button" aria-label="Move left">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div id="track" title="Slide to steer"><div id="thumb"></div></div>
    <button class="arrow" id="btnR" type="button" aria-label="Move right">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div id="flash"></div>
  <div id="overlay"></div>

</div>

<script>
(() => {
  'use strict';

  // Change MIN and MAX to change which times tables show up (for example 2 to 12).
  const CFG = { MIN: 2, MAX: 9, ROUNDS: 10, SHIELDS: 3 };
  const LIM = 0.9;
  const KEY = 'factor-flight-best';

  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  const cs = getComputedStyle(document.documentElement);
  const tok = n => cs.getPropertyValue(n).trim();
  const COL = {
    space0: tok('--space-0'), space1: tok('--space-1'), ink: tok('--ink'),
    gold: tok('--gold'), goldLight: tok('--gold-light'), onGold: tok('--on-gold'),
    ice: tok('--ice'), coral: tok('--coral'), mint: tok('--mint'), violet: tok('--violet'),
    orange: tok('--orange'), pink: tok('--pink'), blue: tok('--blue')
  };
  const PLANETS = [COL.violet, COL.mint, COL.orange, COL.pink, COL.blue];
  const STAR_TINTS = [COL.ink, COL.ink, COL.ice, COL.gold];
  const rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  };
  const FONT = "'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif";

  const app = $('app'), cv = $('stage'), ctx = cv.getContext('2d');
  const overlay = $('overlay'), hud = $('hud'), flashEl = $('flash');

  // ---------- layout ----------
  let W = 0, H = 0, dpr = 1, vpX = 0, vpY = 0, shipY = 0, halfW = 0, objR = 26;
  let bgGrad, nebA, nebB, glow;

  function resize() {
    const r = app.getBoundingClientRect();
    W = r.width; H = r.height;
    if (!W || !H) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const hudBottom = hud.getBoundingClientRect().bottom - r.top;
    vpX = W / 2;
    vpY = clamp(hudBottom + 36, H * 0.3, H * 0.46);
    // The ship sits above the steering bar so a thumb on the bar never covers it.
    shipY = H - $('controls').getBoundingClientRect().height - 52;
    halfW = W / 2 - 12;
    objR = clamp(W * 0.07, 20, 34);

    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, COL.space0);
    bgGrad.addColorStop(1, COL.space1);
    nebA = ctx.createRadialGradient(W * 0.88, H * 0.58, 0, W * 0.88, H * 0.58, W * 0.9);
    nebA.addColorStop(0, rgba(COL.violet, 0.2)); nebA.addColorStop(1, rgba(COL.violet, 0));
    nebB = ctx.createRadialGradient(W * 0.06, H * 0.4, 0, W * 0.06, H * 0.4, W * 0.8);
    nebB.addColorStop(0, rgba(COL.mint, 0.13)); nebB.addColorStop(1, rgba(COL.mint, 0));
    glow = ctx.createRadialGradient(vpX, vpY, 0, vpX, vpY, W * 0.75);
    glow.addColorStop(0, rgba(COL.gold, 0.3)); glow.addColorStop(0.18, rgba(COL.gold, 0.1)); glow.addColorStop(1, rgba(COL.gold, 0));
  }

  // ---------- perspective ----------
  // u runs 0 (at the vanishing point) to 1 (level with the ship) and beyond (passing under it).
  function project(wx, u) {
    const f = Math.pow(u, 1.5);
    const k = 0.35 + 0.65 * f;
    return { x: vpX + wx * halfW * k, y: vpY + (shipY - vpY) * f, k };
  }

  // ---------- audio ----------
  let actx = null, muted = false;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
  }
  function tone(freq, dur, type, vol, delay, slideTo) {
    if (!actx || muted) return;
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }
  const sfx = {
    pick() { tone(660, 0.1, 'triangle', 0.12); tone(990, 0.14, 'triangle', 0.1, 0.07); },
    wrong() { tone(170, 0.3, 'sawtooth', 0.09, 0, 80); },
    round() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'triangle', 0.11, i * 0.08)); },
    win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.24, 'triangle', 0.12, i * 0.11)); },
    lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.26, 'sine', 0.12, i * 0.15)); }
  };
  $('mute').addEventListener('click', () => {
    muted = !muted;
    $('mute').classList.toggle('off', muted);
    $('mute').setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
    music.applyGain();
    if (!muted) { ensureAudio(); sfx.pick(); }
  });

  // ---------- state ----------
  let state = 'ready'; // ready | playing | interlude | won | lost
  const ship = { wx: 0, target: 0, bank: 0, pulse: 0, pulseCol: COL.gold };
  let objs = [], parts = [], stars = [];
  let round = null, done = 0, shields = CFG.SHIELDS, wrongCount = 0, usedProducts = new Set(), kinds = [];
  let spawnT = 0, sinceNeeded = 0, interludeT = 0, tAnim = 0, warp = 0.6, worldAlpha = 1, startTime = 0;

  const progress = () => clamp(done / (CFG.ROUNDS - 1), 0, 1);
  const travelTime = () => lerp(5.0, 3.8, progress());
  const spawnEvery = () => travelTime() / 6.5;

  // ---------- HUD ----------
  const SHIELD_SVG = '<svg class="shield" viewBox="0 0 20 22" aria-hidden="true"><path d="M10 1.5 18 4.5v6c0 5-3.4 8.4-8 10-4.6-1.6-8-5-8-10v-6z" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  $('shields').innerHTML = SHIELD_SVG.repeat(CFG.SHIELDS);
  $('meter').innerHTML = '<i></i>'.repeat(CFG.ROUNDS);
  document.querySelector('.tally .of').textContent = '/' + CFG.ROUNDS;

  function setSlot(el, val, pop) {
    if (val === null || val === undefined) {
      el.textContent = '?'; el.classList.remove('filled', 'pop');
    } else {
      el.textContent = val; el.classList.add('filled');
      if (pop) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }
    }
  }
  function renderHud(popA, popB) {
    const kind = round.kind, single = kind !== 'factors';
    $('target').textContent = kind === 'product' ? round.a + ' × ' + round.b
      : kind === 'missing' ? round.a + ' × ? = ' + round.product : round.product;
    $('target').classList.toggle('term', kind === 'product');
    $('target').classList.toggle('term-long', kind === 'missing');
    $('label').textContent = kind === 'product' ? 'Catch the answer to'
      : kind === 'missing' ? 'Catch the missing number' : 'Catch two numbers that multiply to';
    $('slotA').hidden = single;
    $('times').hidden = single;
    setSlot($('slotA'), round.picked, popA);
    setSlot($('slotB'), round.complete ? (single ? round.answer : round.need) : null, popB);
    hud.classList.toggle('done', !!round.complete);
    $('done').textContent = done;
    [].forEach.call($('meter').children, (el, i) => el.classList.toggle('on', i < done));
    [].forEach.call($('shields').children, (el, i) => el.classList.toggle('lost', i >= shields));
  }

  // ---------- rounds ----------
  function newRound() {
    let a, b, p, tries = 0;
    do { a = randInt(CFG.MIN, CFG.MAX); b = randInt(CFG.MIN, CFG.MAX); p = a * b; tries++; } while (usedProducts.has(p) && tries < 80);
    usedProducts.add(p);
    // Three round types, mixed at random, rarely repeating and never three of the same kind in a row.
    const KINDS = ['factors', 'product', 'missing'];
    const last = kinds[kinds.length - 1];
    let kind = pick(KINDS);
    if (kind === last && (kinds[kinds.length - 2] === last || Math.random() < 0.6)) kind = pick(KINDS.filter(k => k !== last));
    kinds.push(kind);
    round = {
      kind, product: p, a, b, valid: [], pool: [], picked: null, need: null, complete: false,
      answer: kind === 'product' ? p : kind === 'missing' ? b : null
    };
    if (kind === 'factors') {
      for (let d = CFG.MIN; d <= CFG.MAX; d++) {
        if (p % d === 0) { const q = p / d; if (q >= CFG.MIN && q <= CFG.MAX) round.valid.push(d); }
      }
    } else if (kind === 'product') {
      // Wrong answers a learner might really pick, plus a few random products.
      const near = [a * (b - 1), a * (b + 1), (a - 1) * b, (a + 1) * b, a + b, p - 10, p + 10, p - 1, p + 1];
      const nearOk = near.filter((v, i) => v >= 2 && v !== p && near.indexOf(v) === i);
      const rand = [];
      for (let i = 0; i < 4; i++) {
        const v = randInt(CFG.MIN, CFG.MAX) * randInt(CFG.MIN, CFG.MAX);
        if (v !== p) rand.push(v);
      }
      round.pool = nearOk.concat(nearOk, rand);
    } else {
      // Wrong factors a learner might pick: neighbours of the answer, the known factor, or subtracting instead of dividing.
      const near = [b - 1, b + 1, b - 2, b + 2, a, p - a];
      const nearOk = near.filter((v, i) => v >= 2 && v !== b && near.indexOf(v) === i);
      const rand = [];
      for (let i = 0; i < 3; i++) {
        const v = randInt(CFG.MIN, CFG.MAX);
        if (v !== b) rand.push(v);
      }
      round.pool = nearOk.concat(nearOk, rand);
    }
    objs = []; worldAlpha = 0; spawnT = 0.5; sinceNeeded = 0;
    renderHud();
  }

  function spawn() {
    let val;
    sinceNeeded++;
    const force = sinceNeeded >= 3 || Math.random() < 0.34;
    if (round.kind !== 'factors') {
      if (force) { val = round.answer; sinceNeeded = 0; }
      else val = pick(round.pool);
    } else {
      const needSet = round.picked === null ? round.valid : [round.need];
      if (force) { val = pick(needSet); sinceNeeded = 0; }
      else {
        const pool = [];
        for (let v = CFG.MIN; v <= CFG.MAX; v++) if (needSet.indexOf(v) < 0) pool.push(v);
        val = pick(pool);
      }
    }
    let bx = 0, bd = -1;
    for (let i = 0; i < 6; i++) {
      const x = rnd(-0.88, 0.88);
      let d = 9;
      for (const o of objs) if (o.u < 0.4) d = Math.min(d, Math.abs(o.wx - x));
      if (d > bd) { bd = d; bx = x; }
    }

  // ---------- input ----------

  }

  // ---------- starfield ----------
  function makeStar(init) {

  }

  // ---------- update ----------
  function update(dt) {

    const wTarget = state === 'interlude' ? 2.6 : live ? 1 : 0.6;
    warp += (wTarget - warp) * Math.min(1, dt * 4);
    const w = warp * (reduce ? 0.5 : 1);
    for (const s of stars) {
      const dr = dt * w * (0.1 + s.r * 1.5) * s.v;
      s.r += dr; s.dr = dr;
      if (s.r > 1) Object.assign(s, makeStar(false));
    }

    if (!live) ship.target = Math.sin(tAnim * 0.7) * 0.55;
    if (live) music.setFactor(1 + 0.025 * Math.min(done, CFG.ROUNDS));
    const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);

  // ---------- draw ----------
  function starPath(x, y, ro, ri, rot) {

    for (let i = 0; i < 10; i++) {

      const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;

    }

  }
  function drawNumber(v, x, y, r, fill, stroke) {
    const len = String(v).length;
    ctx.font = '700 ' + Math.max(10, r * (len >= 3 ? 0.68 : len === 2 ? 0.86 : 1.05)) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (stroke) { ctx.lineWidth = Math.max(2, r * 0.22); ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.strokeText(v, x, y + r * 0.05); }
    ctx.fillStyle = fill; ctx.fillText(v, x, y + r * 0.05);
  }

  function drawObj(o) {
    const p = project(o.wx, o.u), r = objR * p.k, x = p.x, y = p.y;
    const alpha = worldAlpha * Math.min(1, o.u / 0.12);
    if (alpha < 0.01) return;
    ctx.globalAlpha = alpha;
    let g = ctx.createRadialGradient(x, y, r * 0.4, x, y, r * 2.2);
    g.addColorStop(0, rgba(o.col, 0.34)); g.addColorStop(1, rgba(o.col, 0));

      }

      ctx.fillStyle = o.col; ctx.fillRect(x - r, y - r, r * 2, r * 2);
      g = ctx.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.05, x - r * 0.2, y - r * 0.2, r * 1.1);
      g.addColorStop(0, rgba('#ffffff', 0.5)); g.addColorStop(1, rgba('#ffffff', 0));
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
      g = ctx.createRadialGradient(x + r * 0.3, y + r * 0.3, r * 0.2, x + r * 0.3, y + r * 0.3, r * 1.4);
      g.addColorStop(0, rgba(COL.space0, 0)); g.addColorStop(1, rgba(COL.space0, 0.6));
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
      ctx.restore();
      if (o.ring) {
        ctx.save(); ctx.translate(x, y); ctx.rotate(o.tilt); ctx.scale(1, 0.28);
        ctx.beginPath(); ctx.arc(0, 0, ringR, 0, Math.PI);
        ctx.lineWidth = r * 0.3; ctx.strokeStyle = rgba(COL.ink, 0.75); ctx.stroke(); ctx.restore();
      }
      drawNumber(o.val, x, y, r * 0.95, '#ffffff', COL.space0);
    } else {
      let dx = vpX - x, dy = vpY - y; const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
      const L = r * 3.4, ex = x + dx * L, ey = y + dy * L, px = -dy * r * 0.85, py = dx * r * 0.85;
      g = ctx.createLinearGradient(x, y, ex, ey);

      ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x + px, y + py); ctx.lineTo(ex, ey); ctx.lineTo(x - px, y - py); ctx.closePath(); ctx.fill();
      g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.05, x, y, r);

  function hull(s) {

  function drawShip() {
    const x = vpX + ship.wx * halfW, y = shipY, s = objR * 1.1;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ship.bank);
    const fl = 0.85 + 0.15 * Math.sin(tAnim * 38) + Math.random() * 0.06;
    let g = ctx.createRadialGradient(0, s * 0.55, 0, 0, s * 0.55, s * 1.9 * fl);
    g.addColorStop(0, rgba(COL.ice, 0.8)); g.addColorStop(0.35, rgba(COL.ice, 0.26)); g.addColorStop(1, rgba(COL.ice, 0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, s * 0.55, s * 1.9 * fl, 0, Math.PI * 2); ctx.fill();

  }

  function draw() {
    ctx.globalAlpha = 1;
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

  // ---------- music: song data ----------
  const STEPS = 32;        // 4 bars of 8 eighth notes

  const WAVES = [['triangle', 'Soft'], ['sine', 'Pure'], ['sawtooth', 'Bright'], ['square', 'Hollow']];

  const BASS_DEGS = [4, 3, 2, 1, 0, -1, -2];

  function defaultSong() {

  const song = defaultSong();

  const semi = d => {
    const s = SCALES[song.scale].semis, n = s.length;
    return s[mod(d, n)] + 12 * Math.floor(d / n);
  };
  const rootMidi = base => base + mod(song.key - (base % 12), 12);
  const degMidi = (d, base) => rootMidi(base) + semi(d);
  const degName = d => NOTE_NAMES[mod(song.key + semi(d), 12)];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);

  // ---------- music: engine ----------
  const music = (() => {
    let bus = null, timer = null, nextTime = 0, step = 0, factor = 1, running = false, onStep = null;

    function build() {
      if (bus || !actx) return;
      const master = actx.createGain(), duck = actx.createGain(), mix = actx.createGain();
      mix.connect(duck); duck.connect(master); master.connect(actx.destination);
      const layers = {};
      LAYER_IDS.forEach(k => { const g = actx.createGain(); g.connect(mix); layers[k] = g; });
      const delay = actx.createDelay(1.5), fb = actx.createGain(), lp = actx.createBiquadFilter(), send = actx.createGain();
      lp.type = 'lowpass'; lp.frequency.value = 2400; fb.gain.value = 0.36; send.gain.value = 0.42;
      layers.lead.connect(send); send.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(mix);
      const len = actx.sampleRate, noise = actx.createBuffer(1, len, actx.sampleRate), data = noise.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      bus = { master, duck, layers, delay, noise };
      applyGain(); tempoFx();
    }
    function applyGain() {
      if (!bus) return;
      const now = actx.currentTime;
      bus.master.gain.cancelScheduledValues(now);
      bus.master.gain.setTargetAtTime(muted ? 0 : song.master * 0.9, now, 0.03);
      LAYER_IDS.forEach(k => bus.layers[k].gain.setTargetAtTime(song[k].mute ? 0 : song[k].vol * LEVEL[k], now, 0.03));
    }
    function tempoFx() {
      if (bus) bus.delay.delayTime.setTargetAtTime(60 / (song.bpm * factor) * 0.75, actx.currentTime, 0.05);
    }

    function osc(type, freq, t, stop, detune) {
      const o = actx.createOscillator();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (detune) o.detune.value = detune;
      o.start(t); o.stop(stop);
      return o;
    }
    function kickV(t) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(1, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.connect(g); g.connect(bus.layers.drums); o.start(t); o.stop(t + 0.35);
    }
    function noiseV(t, dur, hp, peak) {
      const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      s.buffer = bus.noise; f.type = 'highpass'; f.frequency.value = hp;
      g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      s.connect(f); f.connect(g); g.connect(bus.layers.drums);
      s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    }
    function snareV(t) {
      noiseV(t, 0.18, 1400, 0.6);
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.1);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(g); g.connect(bus.layers.drums); o.start(t); o.stop(t + 0.16);
    }
    const hatV = t => noiseV(t, 0.05, 7500, 0.28);
    function bassV(t, midi, dur, wave) {
      const g = actx.createGain(), f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.Q.value = 1.2;
      f.frequency.setValueAtTime(1500, t); f.frequency.exponentialRampToValueAtTime(380, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.7, t + 0.01); g.gain.setTargetAtTime(0.0001, t + dur * 0.9, 0.05);
      osc(wave, hz(midi), t, t + dur + 0.4).connect(f);
      f.connect(g); g.connect(bus.layers.bass);
    }
    function leadV(t, midi, dur, wave) {
      const g = actx.createGain(), f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 3800;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.22, t + dur * 0.5); g.gain.setTargetAtTime(0.0001, t + dur, 0.06);
      [-7, 7].forEach(dt => osc(wave, hz(midi), t, t + dur + 0.5, dt).connect(f));
      f.connect(g); g.connect(bus.layers.lead);
    }
    function padV(t, midis, dur, wave) {
      const g = actx.createGain(), f = actx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 1200; f.Q.value = 0.5;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.5 / midis.length, t + 0.3); g.gain.setTargetAtTime(0.0001, t + dur, 0.25);
      midis.forEach(m => [-8, 8].forEach(dt => osc(wave, hz(m), t, t + dur + 1.6, dt).connect(f)));
      f.connect(g); g.connect(bus.layers.pad);
    }

    function chordMidis(r) {
      const n = SCALES[song.scale].semis.length;
      r = r % n;
      const rr = r >= 4 ? r - n : r;
      return [rr, rr + 2, rr + 4].map(d => degMidi(d, BASE.pad));
    }
    const stepDur = () => 60 / (song.bpm * factor) / 2;
    function playStep(s, t) {
      const sd = stepDur();
      if (song.drums.kick[s]) kickV(t);
      if (song.drums.snare[s]) snareV(t);
      if (song.drums.hat[s]) hatV(t);
      const b = song.bass.notes[s];
      if (b !== null) bassV(t, degMidi(b, BASE.bass), sd * 0.92, song.bass.wave);
      const l = song.lead.notes[s];
      if (l !== null) leadV(t, degMidi(l, BASE.lead), sd * 0.85, song.lead.wave);
      if (s % PAD_SLOT === 0) {
        const c = song.pad.chords[s / PAD_SLOT];
        if (c !== null) padV(t, chordMidis(c), sd * PAD_SLOT * 1.02, song.pad.wave);
      }
    }
    function tick() {
      const now = actx.currentTime;
      if (nextTime < now - 0.25) nextTime = now + 0.05;
      while (nextTime < now + 0.12) {
        playStep(step, nextTime);
        if (onStep) {
          const s = step;
          setTimeout(() => { if (running) onStep(s); }, Math.max(0, (nextTime - now) * 1000));
        }
        nextTime += stepDur();
        step = (step + 1) % STEPS;
      }
    }

    function start() {
      ensureAudio();
      if (!actx) return;
      build();
      stop(0, true);
      applyGain();
      running = true; step = 0; nextTime = actx.currentTime + 0.1;
      tick(); timer = setInterval(tick, 25);
    }
    function stop(fade, quiet) {
      if (timer) { clearInterval(timer); timer = null; }
      running = false;
      if (bus && !quiet) {
        const now = actx.currentTime;
        bus.master.gain.cancelScheduledValues(now);
        bus.master.gain.setTargetAtTime(0, now, fade ? fade / 3 : 0.04);
      }
      if (onStep) onStep(-1);
    }
    function duck() {
      if (!bus) return;
      const now = actx.currentTime, g = bus.duck.gain;
      g.cancelScheduledValues(now); g.setValueAtTime(0.25, now); g.linearRampToValueAtTime(1, now + 0.7);
    }
    function setFactor(f) {
      if (Math.abs(f - factor) < 0.001) return;
      factor = f; tempoFx();
    }
    function audition(layer, val) {
      ensureAudio();
      if (!actx) return;
      build(); applyGain();
      const t = actx.currentTime + 0.01;
      if (layer === 'drums') { if (val === 'kick') kickV(t); else if (val === 'snare') snareV(t); else hatV(t); }
      else if (layer === 'bass') bassV(t, degMidi(val, BASE.bass), 0.3, song.bass.wave);
      else if (layer === 'lead') leadV(t, degMidi(val, BASE.lead), 0.3, song.lead.wave);
      else padV(t, chordMidis(val), 0.9, song.pad.wave);
    }
    return {
      start, stop, duck, setFactor, audition, applyGain,
      sync() { applyGain(); tempoFx(); },
      setStepHandler(fn) { onStep = fn; }
    };
  })();

  // ---------- boot ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (W && H) { update(dt); renderThumb(); draw(); }
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(app);
  try {
    document.fonts.load('700 24px Fredoka');
    document.fonts.load('600 14px "Chakra Petch"');
    document.fonts.ready.then(resize);
  } catch (e) {}

  resize();
  newRound();
  showStart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
